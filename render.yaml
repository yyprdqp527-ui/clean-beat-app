services:
  - type: web
    name: dust
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --worker-connections 1000 --preload wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 75 --log-level warning
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: "true"
