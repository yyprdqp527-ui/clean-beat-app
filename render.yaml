services:
  - type: web
    name: dust
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --worker-connections 1000 wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 75 --log-level warning
    envVars:
      - key: SECRET_KEY
        generateValue: true
        sync: false           # ← NE CHANGE PLUS après le premier déploiement
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: "true"
      # DATABASE_URL est définie manuellement dans le dashboard Render
      # (Environment → DATABASE_URL → coller l'Internal Database URL de ta base existante)
