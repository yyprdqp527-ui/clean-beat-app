<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Mobile - Dust</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; background: #f5f7f8; 
            font-size: 14px; line-height: 1.4;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card { 
            background: white; border-radius: 12px; padding: 16px; 
            margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status { padding: 8px 12px; border-radius: 8px; margin: 8px 0; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn { 
            background: #007bff; color: white; border: none; 
            padding: 12px 20px; border-radius: 8px; cursor: pointer;
            margin: 8px 4px; font-size: 14px; min-width: 120px;
        }
        .btn:active { background: #0056b3; transform: translateY(1px); }
        .log { 
            background: #f8f9fa; border: 1px solid #dee2e6; 
            padding: 12px; border-radius: 8px; max-height: 300px; 
            overflow-y: auto; font-family: monospace; font-size: 12px;
            white-space: pre-wrap;
        }
        h2 { color: #333; font-size: 18px; margin: 16px 0 8px 0; }
        .test-bar { 
            width: 100%; height: 20px; background: #e9ecef; 
            border-radius: 10px; overflow: hidden; margin: 8px 0;
        }
        .test-fill { 
            height: 100%; background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%; transition: width 0.5s ease;
        }
        .device-info { font-size: 12px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Diagnostic Mobile Dust</h1>
        
        <div class="card">
            <h2>📊 Informations Appareil</h2>
            <div class="device-info">
                <div>📱 User Agent: <span id="userAgent"></span></div>
                <div>📏 Écran: <span id="screenSize"></span></div>
                <div>🌐 Navigateur: <span id="browserInfo"></span></div>
                <div>📡 Connexion: <span id="connectionType"></span></div>
                <div>🕐 Heure: <span id="currentTime"></span></div>
            </div>
        </div>
        
        <div class="card">
            <h2>🔗 Tests de Connectivité</h2>
            <div id="connectivity-status"></div>
            <button class="btn" onclick="testConnectivity()">🔄 Tester Connexion</button>
            <button class="btn" onclick="testDust()">🏠 Test Dust</button>
        </div>
        
        <div class="card">
            <h2>🎨 Test Barres de Progression</h2>
            <div>Points test: <span id="testPoints">0</span></div>
            <div class="test-bar">
                <div class="test-fill" id="testBar"></div>
            </div>
            <button class="btn" onclick="simulatePoints(5)">+5 pts</button>
            <button class="btn" onclick="simulatePoints(10)">+10 pts</button>
            <button class="btn" onclick="resetTest()">Reset</button>
        </div>
        
        <div class="card">
            <h2>📋 CSS/JS Compatibility</h2>
            <div id="compatibility-results"></div>
            <button class="btn" onclick="testCompatibility()">🧪 Test Compatibilité</button>
        </div>
        
        <div class="card">
            <h2>📝 Log de Debug</h2>
            <div class="log" id="debugLog">Diagnostic initialisé...\n</div>
            <button class="btn" onclick="clearLog()">🗑️ Vider Log</button>
        </div>
    </div>

    <script>
        let testPointsValue = 0;
        
        function log(message) {
            const logEl = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString('fr-FR');
            logEl.textContent += `[${time}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function updateDeviceInfo() {
            document.getElementById('userAgent').textContent = navigator.userAgent;
            document.getElementById('screenSize').textContent = `${screen.width}x${screen.height} (${window.innerWidth}x${window.innerHeight})`;
            
            // Détection navigateur
            let browser = 'Inconnu';
            if (navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) {
                browser = 'Safari';
            } else if (navigator.userAgent.includes('Chrome')) {
                browser = 'Chrome';
            } else if (navigator.userAgent.includes('Firefox')) {
                browser = 'Firefox';
            }
            document.getElementById('browserInfo').textContent = browser;
            
            // Type de connexion
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            document.getElementById('connectionType').textContent = connection ? connection.effectiveType || 'Inconnue' : 'Non supportée';
            
            document.getElementById('currentTime').textContent = new Date().toLocaleString('fr-FR');
        }
        
        function testConnectivity() {
            log('🔍 Test de connectivité...');
            const statusEl = document.getElementById('connectivity-status');
            statusEl.innerHTML = '<div class="status warning">⏳ Test en cours...</div>';
            
            // Test IP locale
            fetch('http://192.168.1.156:8080/menu', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        statusEl.innerHTML = '<div class="status success">✅ Dust accessible (port 8080)</div>';
                        log('✅ Connexion Dust réussie');
                    } else {
                        statusEl.innerHTML = '<div class="status error">❌ Dust inaccessible (erreur ' + response.status + ')</div>';
                        log('❌ Erreur Dust: ' + response.status);
                    }
                })
                .catch(error => {
                    statusEl.innerHTML = '<div class="status error">❌ Impossible de joindre Dust</div>';
                    log('❌ Erreur réseau: ' + error.message);
                });
        }
        
        function testDust() {
            log('🏠 Redirection vers Dust...');
            window.open('http://192.168.1.156:8080', '_blank');
        }
        
        function simulatePoints(points) {
            testPointsValue += points;
            updateTestBar();
            log(`➕ +${points} points (total: ${testPointsValue})`);
        }
        
        function updateTestBar() {
            const percentage = Math.min(testPointsValue, 100);
            const barEl = document.getElementById('testBar');
            const pointsEl = document.getElementById('testPoints');
            
            barEl.style.width = percentage + '%';
            pointsEl.textContent = testPointsValue;
            
            // Couleur selon progression (logique Dust)
            const hue = Math.floor((percentage * 120) / 100);
            barEl.style.background = `hsl(${hue}, 80%, 55%)`;
        }
        
        function resetTest() {
            testPointsValue = 0;
            updateTestBar();
            log('🔄 Test remis à zéro');
        }
        
        function testCompatibility() {
            log('🧪 Test de compatibilité CSS/JS...');
            const results = [];
            
            // Tests CSS
            const testDiv = document.createElement('div');
            document.body.appendChild(testDiv);
            
            try {
                testDiv.style.display = 'flex';
                results.push('✅ Flexbox supporté');
            } catch(e) {
                results.push('❌ Flexbox non supporté');
            }
            
            try {
                testDiv.style.background = 'hsl(120, 80%, 55%)';
                results.push('✅ HSL colors supportées');
            } catch(e) {
                results.push('❌ HSL colors non supportées');
            }
            
            try {
                testDiv.style.transition = 'height 0.4s ease';
                results.push('✅ CSS Transitions supportées');
            } catch(e) {
                results.push('❌ CSS Transitions non supportées');
            }
            
            // Tests JS
            try {
                document.querySelectorAll('div').forEach(() => {});
                results.push('✅ forEach supporté');
            } catch(e) {
                results.push('❌ forEach non supporté');
            }
            
            try {
                fetch('data:text/plain,test');
                results.push('✅ Fetch API supporté');
            } catch(e) {
                results.push('❌ Fetch API non supporté');
            }
            
            document.body.removeChild(testDiv);
            
            document.getElementById('compatibility-results').innerHTML = results.map(r => 
                `<div class="status ${r.includes('✅') ? 'success' : 'error'}">${r}</div>`
            ).join('');
            
            log('🧪 Tests compatibilité terminés');
        }
        
        function clearLog() {
            document.getElementById('debugLog').textContent = 'Log vidé.\n';
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            updateDeviceInfo();
            log('📱 Page de diagnostic chargée');
            log('💡 Utilisez les boutons pour tester les fonctionnalités');
            
            // Test automatique de connectivité au chargement
            setTimeout(testConnectivity, 1000);
        });
        
        // Mise à jour de l'heure toutes les secondes
        setInterval(() => {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('fr-FR');
        }, 1000);
    </script>
</body>
</html>
