<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Debug Badges Inspector</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f8fafc; color: #153036; padding: 24px; }
        h1 { font-size: 1.6em; margin-bottom: 0.5em; }
        .section { margin-bottom: 2em; }
        pre { background: #f3f3f3; border-radius: 8px; padding: 12px; font-size: 0.95em; overflow-x: auto; }
        .ok { color: #28a745; font-weight: bold; }
        .err { color: #e55353; font-weight: bold; }
        .warn { color: #f39c12; font-weight: bold; }
        .badge-demo { display: inline-flex; align-items: center; gap: 8px; margin: 8px 0; }
        .room-new-mission-badge, .room-baby-badge {
            min-width: 18px; height: 18px; padding: 0 4px;
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: #fff; line-height: 1;
        }
        .room-new-mission-badge { background: #FF6B35; border: 2px solid #fff; }
        .room-baby-badge { background: #F472B6; border: 2px solid #fff; }
    </style>
</head>
<body>
    <h1>Debug Badges Inspector</h1>
    <div class="section">
        <h2>1. État du DOM</h2>
        <button onclick="inspectBadges()">Inspecter les badges dans le DOM</button>
        <pre id="domResult">(Clique pour lancer l'inspection...)</pre>
    </div>
    <div class="section">
        <h2>2. Test API</h2>
        <button onclick="testApi()">Tester /api/unread_counts et /api/rooms_with_missions</button>
        <pre id="apiResult">(Clique pour tester les API...)</pre>
    </div>
    <div class="section">
        <h2>3. Démo badges</h2>
        <div class="badge-demo">
            <span>Mission :</span>
            <span class="room-new-mission-badge">3</span>
        </div>
        <div class="badge-demo">
            <span>Bébé :</span>
            <span class="room-baby-badge">2</span>
        </div>
    </div>
    <div class="section">
        <h2>4. Console JS</h2>
        <button onclick="showConsoleErrors()">Afficher erreurs JS</button>
        <pre id="consoleResult">(Clique pour afficher les erreurs JS...)</pre>
    </div>
<script>
function inspectBadges() {
    let out = [];
    let mission = document.querySelectorAll('.room-new-mission-badge');
    let baby = document.querySelectorAll('.room-baby-badge');
    out.push('Badges mission trouvés : ' + mission.length);
    mission.forEach((el,i) => out.push('  ['+i+'] text=' + el.textContent + ', display=' + getComputedStyle(el).display + ', visible=' + (el.offsetParent!==null)));
    out.push('Badges bébé trouvés : ' + baby.length);
    baby.forEach((el,i) => out.push('  ['+i+'] text=' + el.textContent + ', display=' + getComputedStyle(el).display + ', visible=' + (el.offsetParent!==null)));
    document.getElementById('domResult').textContent = out.join('\n');
}
async function testApi() {
    let out = [];
    try {
        let r1 = await fetch('/api/unread_counts', {cache:'no-store'});
        let j1 = await r1.json();
        out.push('/api/unread_counts : ' + (r1.ok ? 'OK' : 'ERREUR ' + r1.status));
        out.push(JSON.stringify(j1, null, 2));
    } catch(e) { out.push('/api/unread_counts : ERREUR ' + e); }
    try {
        let r2 = await fetch('/api/rooms_with_missions', {cache:'no-store'});
        let j2 = await r2.json();
        out.push('/api/rooms_with_missions : ' + (r2.ok ? 'OK' : 'ERREUR ' + r2.status));
        out.push(JSON.stringify(j2, null, 2));
    } catch(e) { out.push('/api/rooms_with_missions : ERREUR ' + e); }
    document.getElementById('apiResult').textContent = out.join('\n');
}
function showConsoleErrors() {
    let out = [];
    if (window.__lastErrors && window.__lastErrors.length) {
        out = window.__lastErrors;
    } else {
        out.push('Aucune erreur JS interceptée.');
    }
    document.getElementById('consoleResult').textContent = out.join('\n');
}
window.__lastErrors = [];
window.addEventListener('error', function(e) {
    window.__lastErrors.push('[Erreur] ' + e.message + ' (' + e.filename + ':' + e.lineno + ')');
});
window.addEventListener('unhandledrejection', function(e) {
    window.__lastErrors.push('[Promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
</body>
</html>
