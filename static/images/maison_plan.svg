<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 334 484" width="334" height="484">
  <defs>
    <!-- Dégradé de fond -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A6D3DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#597176;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDAE54;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Filtre blur pour glassmorphism -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    
    <!-- Ombre douce -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond dégradé CleanBeat -->
  <rect width="334" height="484" fill="url(#bgGradient)"/>
  
  <!-- Cercles décoratifs flous en arrière-plan -->
  <circle cx="80" cy="100" r="60" fill="#FDAE54" opacity="0.15" filter="url(#blur)"/>
  <circle cx="280" cy="150" r="80" fill="#A6D3DC" opacity="0.2" filter="url(#blur)"/>
  <circle cx="150" cy="350" r="100" fill="#597176" opacity="0.1" filter="url(#blur)"/>
  <circle cx="250" cy="420" r="70" fill="#FDAE54" opacity="0.12" filter="url(#blur)"/>
  
  <!-- Toit glassmorphism -->
  <path d="M 167 35 L 25 115 L 309 115 Z" 
        fill="rgba(166, 211, 220, 0.35)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"
        filter="url(#glow)"/>
  
  <!-- === PREMIER ÉTAGE - GLASSMORPHISM === -->
  
  <!-- SALON -->
  <rect x="30" y="125" width="95" height="75" 
        fill="rgba(179, 229, 252, 0.25)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="77" cy="150" r="20" fill="rgba(2, 136, 209, 0.15)"/>
  <text x="77" y="158" text-anchor="middle" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="22" filter="url(#glow)">🛋️</text>
  <text x="77" y="178" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.9">Salon</text>
  
  <!-- CUISINE -->
  <rect x="133" y="125" width="90" height="75" 
        fill="rgba(255, 174, 84, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="178" cy="150" r="20" fill="rgba(253, 174, 84, 0.2)"/>
  <text x="178" y="158" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="22" filter="url(#glow)">🍳</text>
  <text x="178" y="178" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.9">Cuisine</text>
  
  <!-- CHAMBRE ADO -->
  <rect x="231" y="125" width="75" height="75" 
        fill="rgba(171, 71, 188, 0.25)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="268" cy="150" r="18" fill="rgba(156, 39, 176, 0.15)"/>
  <text x="268" y="158" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="20" filter="url(#glow)">🎮</text>
  <text x="268" y="178" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" opacity="0.9">Ado</text>
  
  <!-- === DEUXIÈME ÉTAGE === -->
  
  <!-- PIÈCE BONUS -->
  <rect x="30" y="208" width="65" height="78" 
        fill="rgba(253, 174, 84, 0.35)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="62" cy="235" r="18" fill="rgba(255, 215, 0, 0.2)"/>
  <text x="62" y="243" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="20" filter="url(#glow)">🎁</text>
  <text x="62" y="262" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" opacity="0.9">Bonus</text>
  
  <!-- CHAMBRE PARENTALE -->
  <rect x="103" y="208" width="125" height="78" 
        fill="rgba(248, 187, 208, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="165" cy="235" r="22" fill="rgba(233, 30, 99, 0.15)"/>
  <text x="165" y="243" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="22" filter="url(#glow)">🛏️</text>
  <text x="165" y="263" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.9">Chambre</text>
  
  <!-- SALLE DE BAIN -->
  <rect x="236" y="208" width="70" height="78" 
        fill="rgba(166, 211, 220, 0.35)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="271" cy="235" r="18" fill="rgba(0, 137, 123, 0.15)"/>
  <text x="271" y="243" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="20" filter="url(#glow)">🚿</text>
  <text x="271" y="262" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" opacity="0.9">Bain</text>
  
  <!-- === TROISIÈME ÉTAGE === -->
  
  <!-- CHAMBRE ENFANT -->
  <rect x="30" y="294" width="110" height="78" 
        fill="rgba(200, 230, 201, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="85" cy="321" r="20" fill="rgba(76, 175, 80, 0.15)"/>
  <text x="85" y="329" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="22" filter="url(#glow)">🧒</text>
  <text x="85" y="349" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" opacity="0.9">Enfant</text>
  
  <!-- CHAMBRE BÉBÉ -->
  <rect x="148" y="294" width="100" height="78" 
        fill="rgba(255, 249, 196, 0.35)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="198" cy="321" r="20" fill="rgba(255, 235, 59, 0.2)"/>
  <text x="198" y="329" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="22" filter="url(#glow)">👶</text>
  <text x="198" y="349" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" opacity="0.9">Bébé</text>
  
  <!-- WC -->
  <rect x="256" y="294" width="50" height="78" 
        fill="rgba(224, 224, 224, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="281" cy="321" r="16" fill="rgba(117, 117, 117, 0.15)"/>
  <text x="281" y="329" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="20" filter="url(#glow)">🚽</text>
  <text x="281" y="349" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" opacity="0.9">WC</text>
  
  <!-- === REZ-DE-CHAUSSÉE === -->
  
  <!-- GARAGE -->
  <rect x="30" y="380" width="135" height="80" 
        fill="rgba(207, 216, 220, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="97" cy="410" r="24" fill="rgba(84, 110, 122, 0.15)"/>
  <text x="97" y="418" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="24" filter="url(#glow)">🚗</text>
  <text x="97" y="440" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.9">Garage</text>
  
  <!-- BUANDERIE -->
  <rect x="173" y="380" width="133" height="80" 
        fill="rgba(179, 229, 252, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2" 
        rx="12" 
        filter="url(#glow)"/>
  <circle cx="239" cy="410" r="24" fill="rgba(2, 136, 209, 0.15)"/>
  <text x="239" y="418" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="24" filter="url(#glow)">🧺</text>
  <text x="239" y="440" text-anchor="middle" font-family="'SF Pro Display', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.9">Buanderie</text>
  
  <!-- Highlights glassmorphism sur les cartes -->
  <rect x="30" y="125" width="95" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="133" y="125" width="90" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="231" y="125" width="75" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="30" y="208" width="65" height="2" fill="rgba(255, 255, 255, 0.6)" rx="1"/>
  <rect x="103" y="208" width="125" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="236" y="208" width="70" height="2" fill="rgba(255, 255, 255, 0.6)" rx="1"/>
  <rect x="30" y="294" width="110" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="148" y="294" width="100" height="2" fill="rgba(255, 255, 255, 0.6)" rx="1"/>
  <rect x="256" y="294" width="50" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="30" y="380" width="135" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
  <rect x="173" y="380" width="133" height="2" fill="rgba(255, 255, 255, 0.5)" rx="1"/>
</svg>
