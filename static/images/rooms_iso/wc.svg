<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CFD8DC;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#90A4AE;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sol isométrique (carrelage) -->
  <path d="M 100 40 L 180 80 L 100 120 L 20 80 Z" 
        fill="url(#floorGrad)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"/>
  
  <!-- Mur gauche -->
  <path d="M 20 80 L 100 120 L 100 160 L 20 120 Z" 
        fill="rgba(207, 216, 220, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5"/>
  
  <!-- Mur droit -->
  <path d="M 180 80 L 100 120 L 100 160 L 180 120 Z" 
        fill="rgba(207, 216, 220, 0.25)" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="1.5"/>
  
  <!-- WC (Toilettes) -->
  <path d="M 70 100 L 110 120 L 110 135 L 70 115 Z" 
        fill="rgba(255, 255, 255, 0.9)" 
        stroke="rgba(200, 200, 200, 0.8)" 
        stroke-width="2"/>
  
  <!-- Cuvette -->
  <ellipse cx="90" cy="120" rx="16" ry="7" 
           fill="rgba(166, 211, 220, 0.6)" 
           stroke="rgba(166, 211, 220, 0.9)" 
           stroke-width="1.5"/>
  
  <!-- Réservoir d'eau -->
  <path d="M 75 100 L 105 115 L 105 108 L 75 93 Z" 
        fill="rgba(255, 255, 255, 0.95)" 
        stroke="rgba(200, 200, 200, 0.9)" 
        stroke-width="1.5" rx="2"/>
  <rect x="85" y="96" width="10" height="15" 
        fill="rgba(255, 255, 255, 0.95)" 
        stroke="rgba(200, 200, 200, 0.9)" 
        stroke-width="1.5" rx="1"/>
  
  <!-- Bouton de chasse -->
  <circle cx="90" cy="101" r="3" 
          fill="rgba(200, 200, 200, 0.8)" 
          stroke="rgba(150, 150, 150, 0.9)" 
          stroke-width="1"/>
  
  <!-- Petit lavabo mural -->
  <path d="M 125 110 L 155 125 L 155 130 L 125 115 Z" 
        fill="rgba(255, 255, 255, 0.9)" 
        stroke="rgba(200, 200, 200, 0.8)" 
        stroke-width="1.5"/>
  <!-- Vasque -->
  <ellipse cx="140" cy="120" rx="10" ry="4" 
           fill="rgba(166, 211, 220, 0.6)" 
           stroke="rgba(166, 211, 220, 0.9)" 
           stroke-width="1"/>
  <!-- Robinet -->
  <path d="M 140 112 Q 140 114 142 116" 
        fill="none" 
        stroke="rgba(150, 150, 150, 0.9)" 
        stroke-width="2"
        stroke-linecap="round"/>
  
  <!-- Miroir petit -->
  <rect x="128" y="140" width="24" height="16" 
        fill="rgba(166, 211, 220, 0.3)" 
        stroke="rgba(200, 200, 200, 0.7)" 
        stroke-width="1" rx="2"/>
  <rect x="130" y="142" width="20" height="12" 
        fill="rgba(255, 255, 255, 0.2)" 
        stroke="none"/>
  
  <!-- Distributeur papier -->
  <rect x="50" y="108" width="12" height="16" 
        fill="rgba(224, 224, 224, 0.8)" 
        stroke="rgba(200, 200, 200, 0.8)" 
        stroke-width="1" rx="2"/>
  <circle cx="56" cy="120" r="5" 
          fill="rgba(255, 255, 255, 0.9)" 
          stroke="rgba(200, 200, 200, 0.6)" 
          stroke-width="1"/>
  
  <!-- Brosse WC -->
  <ellipse cx="115" cy="130" rx="4" ry="2" 
           fill="rgba(200, 200, 200, 0.6)" 
           stroke="rgba(150, 150, 150, 0.7)" 
           stroke-width="0.5"/>
  <line x1="115" y1="130" x2="115" y2="120" 
        stroke="rgba(150, 150, 150, 0.7)" 
        stroke-width="2"/>
  
  <!-- Poubelle petite -->
  <path d="M 40 118 L 50 123 L 50 132 L 40 127 Z" 
        fill="rgba(89, 113, 118, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1"/>
  
  <!-- Ventilation/aérateur -->
  <rect x="170" y="88" width="8" height="8" 
        fill="rgba(150, 150, 150, 0.5)" 
        stroke="rgba(150, 150, 150, 0.7)" 
        stroke-width="1" rx="1"/>
  <line x1="172" y1="90" x2="176" y2="90" stroke="rgba(100, 100, 100, 0.6)" stroke-width="0.5"/>
  <line x1="172" y1="92" x2="176" y2="92" stroke="rgba(100, 100, 100, 0.6)" stroke-width="0.5"/>
  <line x1="172" y1="94" x2="176" y2="94" stroke="rgba(100, 100, 100, 0.6)" stroke-width="0.5"/>
  
  <!-- Tapis de sol -->
  <ellipse cx="90" cy="125" rx="20" ry="8" 
           fill="rgba(166, 211, 220, 0.3)" 
           stroke="rgba(166, 211, 220, 0.5)" 
           stroke-width="1"/>
  
  <!-- Icône -->
  <text x="100" y="35" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="24" 
        filter="url(#glow)">🚽</text>
  
  <!-- Label glassmorphism -->
  <rect x="75" y="5" width="50" height="22" 
        fill="rgba(255, 255, 255, 0.25)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5" 
        rx="11"/>
  <text x="100" y="20" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#FFFFFF">WC</text>
</svg>
