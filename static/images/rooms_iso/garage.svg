<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CFD8DC;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#78909C;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sol isométrique (béton) -->
  <path d="M 100 40 L 180 80 L 100 120 L 20 80 Z" 
        fill="url(#floorGrad)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"/>
  
  <!-- Mur gauche -->
  <path d="M 20 80 L 100 120 L 100 160 L 20 120 Z" 
        fill="rgba(207, 216, 220, 0.25)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5"/>
  
  <!-- Mur droit -->
  <path d="M 180 80 L 100 120 L 100 160 L 180 120 Z" 
        fill="rgba(207, 216, 220, 0.2)" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="1.5"/>
  
  <!-- Voiture isométrique -->
  <!-- Carrosserie principale -->
  <path d="M 60 95 L 120 125 L 120 140 L 60 110 Z" 
        fill="rgba(2, 136, 209, 0.7)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"/>
  
  <!-- Toit de voiture -->
  <path d="M 70 85 L 110 105 L 110 95 L 70 75 Z" 
        fill="rgba(2, 136, 209, 0.8)" 
        stroke="rgba(255, 255, 255, 0.6)" 
        stroke-width="2"/>
  <path d="M 70 85 L 110 105 L 120 110 L 80 90 Z" 
        fill="rgba(2, 136, 209, 0.85)" 
        stroke="rgba(255, 255, 255, 0.6)" 
        stroke-width="2"/>
  
  <!-- Pare-brise -->
  <path d="M 75 80 L 105 97 L 105 103 L 75 86 Z" 
        fill="rgba(166, 211, 220, 0.5)" 
        stroke="rgba(166, 211, 220, 0.8)" 
        stroke-width="1.5"/>
  
  <!-- Roues -->
  <ellipse cx="70" cy="118" rx="8" ry="4" 
           fill="rgba(33, 33, 33, 0.9)" 
           stroke="rgba(100, 100, 100, 0.8)" 
           stroke-width="2"/>
  <ellipse cx="110" cy="138" rx="8" ry="4" 
           fill="rgba(33, 33, 33, 0.9)" 
           stroke="rgba(100, 100, 100, 0.8)" 
           stroke-width="2"/>
  
  <!-- Phares -->
  <circle cx="63" cy="108" r="3" 
          fill="rgba(253, 174, 84, 0.8)" 
          stroke="rgba(255, 255, 255, 0.6)" 
          stroke-width="1"
          filter="url(#glow)"/>
  
  <!-- Établi/Workbench -->
  <path d="M 135 105 L 170 123 L 170 130 L 135 112 Z" 
        fill="rgba(121, 85, 72, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <path d="M 135 105 L 170 123 L 170 120 L 135 102 Z" 
        fill="rgba(121, 85, 72, 0.8)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  
  <!-- Outils sur établi -->
  <rect x="145" y="112" width="8" height="3" 
        fill="rgba(200, 200, 200, 0.8)" 
        stroke="rgba(150, 150, 150, 0.7)" 
        stroke-width="0.5"/>
  <circle cx="156" cy="114" r="3" 
          fill="rgba(255, 193, 7, 0.7)" 
          stroke="rgba(255, 255, 255, 0.5)" 
          stroke-width="0.5"/>
  
  <!-- Étagères murales -->
  <path d="M 140 95 L 175 113 L 175 116 L 140 98 Z" 
        fill="rgba(89, 113, 118, 0.5)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1"/>
  <!-- Boîtes rangement -->
  <rect x="145" y="101" width="10" height="8" 
        fill="rgba(253, 174, 84, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1" rx="1"/>
  <rect x="158" y="106" width="10" height="8" 
        fill="rgba(2, 136, 209, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1" rx="1"/>
  
  <!-- Vélos accrochés -->
  <circle cx="30" cy="105" r="6" 
          fill="none" 
          stroke="rgba(233, 30, 99, 0.7)" 
          stroke-width="2"/>
  <circle cx="45" cy="105" r="6" 
          fill="none" 
          stroke="rgba(233, 30, 99, 0.7)" 
          stroke-width="2"/>
  <line x1="30" y1="105" x2="45" y2="105" 
        stroke="rgba(233, 30, 99, 0.7)" 
        stroke-width="2.5"/>
  
  <!-- Cartons empilés -->
  <path d="M 25 115 L 45 126 L 45 135 L 25 124 Z" 
        fill="rgba(121, 85, 72, 0.5)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1"/>
  <path d="M 25 115 L 45 126 L 45 121 L 25 110 Z" 
        fill="rgba(121, 85, 72, 0.7)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1"/>
  <path d="M 28 108 L 48 119 L 48 124 L 28 113 Z" 
        fill="rgba(121, 85, 72, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1"/>
  
  <!-- Porte de garage (lignes) -->
  <line x1="155" y1="135" x2="175" y2="145" stroke="rgba(150, 150, 150, 0.4)" stroke-width="1"/>
  <line x1="155" y1="140" x2="175" y2="150" stroke="rgba(150, 150, 150, 0.4)" stroke-width="1"/>
  <line x1="155" y1="145" x2="175" y2="155" stroke="rgba(150, 150, 150, 0.4)" stroke-width="1"/>
  
  <!-- Icône -->
  <text x="100" y="35" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="24" 
        filter="url(#glow)">🚗</text>
  
  <!-- Label glassmorphism -->
  <rect x="60" y="5" width="80" height="22" 
        fill="rgba(255, 255, 255, 0.25)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5" 
        rx="11"/>
  <text x="100" y="20" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#FFFFFF">Garage</text>
</svg>
