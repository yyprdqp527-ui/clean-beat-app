<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8E6C9;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sol isométrique -->
  <path d="M 100 40 L 180 80 L 100 120 L 20 80 Z" 
        fill="url(#floorGrad)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"/>
  
  <!-- Mur gauche -->
  <path d="M 20 80 L 100 120 L 100 160 L 20 120 Z" 
        fill="rgba(200, 230, 201, 0.3)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5"/>
  
  <!-- Mur droit -->
  <path d="M 180 80 L 100 120 L 100 160 L 180 120 Z" 
        fill="rgba(200, 230, 201, 0.25)" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="1.5"/>
  
  <!-- Lit simple enfant -->
  <path d="M 45 95 L 95 120 L 95 128 L 45 103 Z" 
        fill="rgba(76, 175, 80, 0.5)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <!-- Couverture colorée -->
  <path d="M 47 103 L 93 126 L 93 129 L 47 106 Z" 
        fill="rgba(129, 199, 132, 0.6)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1"/>
  <!-- Oreiller -->
  <ellipse cx="60" cy="106" rx="8" ry="4" 
           fill="rgba(255, 235, 59, 0.7)" 
           stroke="rgba(255, 255, 255, 0.5)" 
           stroke-width="1"/>
  
  <!-- Bureau avec devoirs -->
  <path d="M 110 105 L 145 123 L 145 130 L 110 112 Z" 
        fill="rgba(166, 211, 220, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <path d="M 110 105 L 145 123 L 145 120 L 110 102 Z" 
        fill="rgba(166, 211, 220, 0.8)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  
  <!-- Livres ouverts -->
  <rect x="118" y="114" width="12" height="8" 
        fill="rgba(253, 174, 84, 0.7)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1" rx="1"/>
  <rect x="133" y="120" width="12" height="8" 
        fill="rgba(2, 136, 209, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1" rx="1"/>
  
  <!-- Chaise de bureau enfant -->
  <ellipse cx="135" cy="130" rx="7" ry="3" 
           fill="rgba(76, 175, 80, 0.7)" 
           stroke="rgba(255, 255, 255, 0.5)" 
           stroke-width="1"/>
  <line x1="135" y1="130" x2="135" y2="122" 
        stroke="rgba(89, 113, 118, 0.7)" 
        stroke-width="2.5"/>
  
  <!-- Étagère avec jouets -->
  <path d="M 155 100 L 175 110 L 175 135 L 155 125 Z" 
        fill="rgba(253, 174, 84, 0.4)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <!-- Tablettes -->
  <line x1="155" y1="110" x2="175" y2="120" 
        stroke="rgba(255, 255, 255, 0.6)" 
        stroke-width="2"/>
  <line x1="155" y1="118" x2="175" y2="128" 
        stroke="rgba(255, 255, 255, 0.6)" 
        stroke-width="2"/>
  
  <!-- Jouets sur étagère -->
  <circle cx="162" cy="107" r="3" 
          fill="rgba(255, 193, 7, 0.8)" 
          stroke="rgba(255, 255, 255, 0.5)" 
          stroke-width="0.5"/>
  <circle cx="168" cy="110" r="3" 
          fill="rgba(2, 136, 209, 0.8)" 
          stroke="rgba(255, 255, 255, 0.5)" 
          stroke-width="0.5"/>
  <rect x="160" y="119" width="6" height="6" 
        fill="rgba(233, 30, 99, 0.7)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="0.5" rx="1"/>
  
  <!-- Coffre à jouets -->
  <path d="M 25 110 L 50 124 L 50 132 L 25 118 Z" 
        fill="rgba(253, 174, 84, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <path d="M 25 110 L 50 124 L 50 120 L 25 106 Z" 
        fill="rgba(253, 174, 84, 0.8)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  
  <!-- Ballons/peluches qui dépassent -->
  <circle cx="37" cy="110" r="5" 
          fill="rgba(2, 136, 209, 0.6)" 
          stroke="rgba(255, 255, 255, 0.5)" 
          stroke-width="1"/>
  
  <!-- Poster éducatif mur -->
  <rect x="25" y="130" width="18" height="22" 
        fill="rgba(255, 235, 59, 0.4)" 
        stroke="rgba(255, 235, 59, 0.6)" 
        stroke-width="1"/>
  <text x="34" y="145" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="12">ABC</text>
  
  <!-- Tapis de jeu -->
  <ellipse cx="70" cy="120" rx="30" ry="13" 
           fill="rgba(76, 175, 80, 0.25)" 
           stroke="rgba(76, 175, 80, 0.5)" 
           stroke-width="1.5"/>
  
  <!-- Icône -->
  <text x="100" y="35" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="24" 
        filter="url(#glow)">🧒</text>
  
  <!-- Label glassmorphism -->
  <rect x="40" y="5" width="120" height="22" 
        fill="rgba(255, 255, 255, 0.25)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5" 
        rx="11"/>
  <text x="100" y="20" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#FFFFFF">Chambre Enfant</text>
</svg>
