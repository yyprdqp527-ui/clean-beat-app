<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#A6D3DC;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sol isométrique -->
  <path d="M 100 40 L 180 80 L 100 120 L 20 80 Z" 
        fill="url(#floorGrad)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"/>
  
  <!-- Mur gauche -->
  <path d="M 20 80 L 100 120 L 100 160 L 20 120 Z" 
        fill="rgba(166, 211, 220, 0.2)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5"/>
  
  <!-- Mur droit -->
  <path d="M 180 80 L 100 120 L 100 160 L 180 120 Z" 
        fill="rgba(89, 113, 118, 0.15)" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="1.5"/>
  
  <!-- Canapé isométrique (L-shape) -->
  <!-- Base canapé gauche -->
  <path d="M 50 85 L 85 105 L 85 115 L 50 95 Z" 
        fill="rgba(2, 136, 209, 0.6)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1"/>
  <!-- Dossier canapé -->
  <path d="M 50 85 L 85 105 L 85 100 L 50 80 Z" 
        fill="rgba(2, 136, 209, 0.8)" 
        stroke="rgba(255, 255, 255, 0.6)" 
        stroke-width="1"/>
  
  <!-- Base canapé angle -->
  <path d="M 85 105 L 110 92 L 110 102 L 85 115 Z" 
        fill="rgba(2, 136, 209, 0.5)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1"/>
  
  <!-- Table basse isométrique -->
  <path d="M 100 95 L 130 110 L 115 118 L 85 103 Z" 
        fill="rgba(253, 174, 84, 0.4)" 
        stroke="rgba(255, 255, 255, 0.6)" 
        stroke-width="1.5"
        filter="url(#glow)"/>
  
  <!-- Tapis sous table -->
  <ellipse cx="105" cy="110" rx="30" ry="12" 
           fill="rgba(89, 113, 118, 0.2)" 
           stroke="rgba(255, 255, 255, 0.3)" 
           stroke-width="1"/>
  
  <!-- TV sur mur -->
  <rect x="95" y="140" width="25" height="15" 
        fill="rgba(33, 33, 33, 0.8)" 
        stroke="rgba(100, 100, 100, 0.9)" 
        stroke-width="1.5" rx="2"/>
  <rect x="97" y="142" width="21" height="11" 
        fill="rgba(2, 136, 209, 0.3)" 
        stroke="none"/>
  
  <!-- Lampe décorative -->
  <circle cx="145" cy="95" r="8" 
          fill="rgba(253, 174, 84, 0.7)" 
          stroke="rgba(255, 255, 255, 0.6)" 
          stroke-width="1"
          filter="url(#glow)"/>
  <line x1="145" y1="95" x2="145" y2="110" 
        stroke="rgba(253, 174, 84, 0.5)" 
        stroke-width="2"/>
  
  <!-- Icône -->
  <text x="100" y="35" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="24" 
        filter="url(#glow)">🛋️</text>
  
  <!-- Label glassmorphism -->
  <rect x="60" y="5" width="80" height="22" 
        fill="rgba(255, 255, 255, 0.25)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5" 
        rx="11"
        style="backdrop-filter: blur(10px);"/>
  <text x="100" y="20" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#FFFFFF">Salon</text>
</svg>
