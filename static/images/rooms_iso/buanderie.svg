<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sol isométrique (carrelage) -->
  <path d="M 100 40 L 180 80 L 100 120 L 20 80 Z" 
        fill="url(#floorGrad)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="2"/>
  
  <!-- Mur gauche -->
  <path d="M 20 80 L 100 120 L 100 160 L 20 120 Z" 
        fill="rgba(179, 229, 252, 0.25)" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="1.5"/>
  
  <!-- Mur droit -->
  <path d="M 180 80 L 100 120 L 100 160 L 180 120 Z" 
        fill="rgba(179, 229, 252, 0.2)" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="1.5"/>
  
  <!-- Machine à laver -->
  <path d="M 40 100 L 70 116 L 70 138 L 40 122 Z" 
        fill="rgba(255, 255, 255, 0.9)" 
        stroke="rgba(200, 200, 200, 0.8)" 
        stroke-width="2"/>
  <!-- Hublot -->
  <circle cx="55" cy="122" r="10" 
          fill="rgba(2, 136, 209, 0.3)" 
          stroke="rgba(2, 136, 209, 0.7)" 
          stroke-width="2"/>
  <circle cx="55" cy="122" r="7" 
          fill="rgba(166, 211, 220, 0.4)" 
          stroke="rgba(2, 136, 209, 0.5)" 
          stroke-width="1"/>
  <!-- Panneau de contrôle -->
  <rect x="48" y="108" width="14" height="5" 
        fill="rgba(33, 33, 33, 0.8)" 
        stroke="rgba(100, 100, 100, 0.7)" 
        stroke-width="0.5" rx="1"/>
  <circle cx="52" cy="110" r="1.5" 
          fill="rgba(0, 255, 0, 0.8)" 
          filter="url(#glow)"/>
  
  <!-- Sèche-linge -->
  <path d="M 75 100 L 105 116 L 105 138 L 75 122 Z" 
        fill="rgba(255, 255, 255, 0.9)" 
        stroke="rgba(200, 200, 200, 0.8)" 
        stroke-width="2"/>
  <!-- Hublot -->
  <circle cx="90" cy="122" r="10" 
          fill="rgba(253, 174, 84, 0.2)" 
          stroke="rgba(253, 174, 84, 0.6)" 
          stroke-width="2"/>
  <circle cx="90" cy="122" r="7" 
          fill="rgba(253, 174, 84, 0.3)" 
          stroke="rgba(253, 174, 84, 0.5)" 
          stroke-width="1"/>
  <!-- Panneau de contrôle -->
  <rect x="83" y="108" width="14" height="5" 
        fill="rgba(33, 33, 33, 0.8)" 
        stroke="rgba(100, 100, 100, 0.7)" 
        stroke-width="0.5" rx="1"/>
  <circle cx="87" cy="110" r="1.5" 
          fill="rgba(255, 140, 0, 0.8)" 
          filter="url(#glow)"/>
  
  <!-- Panier à linge -->
  <path d="M 120 115 L 145 128 L 145 142 L 120 129 Z" 
        fill="rgba(121, 85, 72, 0.4)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <!-- Linge qui dépasse -->
  <path d="M 125 120 Q 135 118 140 122" 
        fill="rgba(166, 211, 220, 0.6)" 
        stroke="rgba(166, 211, 220, 0.8)" 
        stroke-width="3"/>
  <path d="M 128 123 Q 133 121 138 124" 
        fill="rgba(248, 187, 208, 0.6)" 
        stroke="rgba(248, 187, 208, 0.8)" 
        stroke-width="3"/>
  
  <!-- Étagère avec produits -->
  <path d="M 110 92 L 160 117 L 160 122 L 110 97 Z" 
        fill="rgba(89, 113, 118, 0.5)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5"/>
  <!-- Produits de lessive -->
  <rect x="118" y="100" width="12" height="15" 
        fill="rgba(2, 136, 209, 0.7)" 
        stroke="rgba(2, 136, 209, 0.9)" 
        stroke-width="1" rx="2"/>
  <rect x="133" y="106" width="12" height="15" 
        fill="rgba(253, 174, 84, 0.7)" 
        stroke="rgba(253, 174, 84, 0.9)" 
        stroke-width="1" rx="2"/>
  <rect x="148" y="112" width="8" height="10" 
        fill="rgba(76, 175, 80, 0.7)" 
        stroke="rgba(76, 175, 80, 0.9)" 
        stroke-width="1" rx="1"/>
  
  <!-- Fer à repasser -->
  <path d="M 155 125 L 170 133 L 165 136 L 150 128 Z" 
        fill="rgba(150, 150, 150, 0.7)" 
        stroke="rgba(100, 100, 100, 0.8)" 
        stroke-width="1.5"/>
  
  <!-- Étendoir/Séchoir -->
  <line x1="25" y1="110" x2="35" y2="115" 
        stroke="rgba(150, 150, 150, 0.7)" 
        stroke-width="2"/>
  <line x1="25" y1="115" x2="35" y2="120" 
        stroke="rgba(150, 150, 150, 0.7)" 
        stroke-width="2"/>
  <line x1="25" y1="120" x2="35" y2="125" 
        stroke="rgba(150, 150, 150, 0.7)" 
        stroke-width="2"/>
  <!-- Vêtements qui sèchent -->
  <rect x="27" y="112" width="6" height="8" 
        fill="rgba(248, 187, 208, 0.6)" 
        stroke="rgba(248, 187, 208, 0.7)" 
        stroke-width="0.5"/>
  <rect x="28" y="119" width="5" height="7" 
        fill="rgba(166, 211, 220, 0.6)" 
        stroke="rgba(166, 211, 220, 0.7)" 
        stroke-width="0.5"/>
  
  <!-- Évier utilitaire -->
  <path d="M 155 105 L 175 116 L 175 122 L 155 111 Z" 
        fill="rgba(255, 255, 255, 0.8)" 
        stroke="rgba(200, 200, 200, 0.7)" 
        stroke-width="1.5"/>
  <ellipse cx="165" cy="114" rx="8" ry="3" 
           fill="rgba(166, 211, 220, 0.6)" 
           stroke="rgba(166, 211, 220, 0.8)" 
           stroke-width="1"/>
  
  <!-- Balai et serpillière -->
  <line x1="170" y1="135" x2="170" y2="120" 
        stroke="rgba(121, 85, 72, 0.7)" 
        stroke-width="2.5"/>
  <path d="M 168 135 L 172 135 L 172 140 L 168 140 Z" 
        fill="rgba(253, 174, 84, 0.6)" 
        stroke="rgba(253, 174, 84, 0.8)" 
        stroke-width="1"/>
  
  <!-- Icône -->
  <text x="100" y="35" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="24" 
        filter="url(#glow)">🧺</text>
  
  <!-- Label glassmorphism -->
  <rect x="50" y="5" width="100" height="22" 
        fill="rgba(255, 255, 255, 0.25)" 
        stroke="rgba(255, 255, 255, 0.5)" 
        stroke-width="1.5" 
        rx="11"/>
  <text x="100" y="20" text-anchor="middle" 
        font-family="'SF Pro Display', sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#FFFFFF">Buanderie</text>
</svg>
