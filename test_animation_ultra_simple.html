<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Animation Victoire</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        .test-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin: 50px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        button {
            display: block;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button:hover {
            background: #45a049;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Test Animation de Victoire</h1>
    <div class="test-avatar" id="avatar">🏆</div>
    <button onclick="testAnimation()">LANCER L'ANIMATION</button>
    <div id="log" style="margin: 20px auto; max-width: 600px; background: white; padding: 20px; border-radius: 8px; font-family: monospace; font-size: 12px;"></div>
    
    <script>
        function log(msg) {
            var logDiv = document.getElementById('log');
            logDiv.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' - ' + msg + '</div>';
            console.log(msg);
        }
        
        function testAnimation() {
            log('🚀 DÉBUT DE L\'ANIMATION');
            
            var pts = 50;
            var whon = 'Test Player';
            
            // EFFET 1: Overlay plein écran
            log('📺 Création de l\'overlay...');
            var overlay = document.createElement('div');
            overlay.id = 'victory-overlay';
            overlay.innerHTML = '<div style="animation: bounceIn 0.5s ease-out forwards;"><div style="font-size:80px; margin-bottom:20px;">🎉🏆🎉</div><div style="font-size:48px; font-weight:bold; color:#FFD700; text-shadow: 0 0 30px gold, 0 5px 10px black;">+' + pts + ' POINTS!</div><div style="font-size:28px; margin-top:20px; color:white; text-shadow: 0 2px 4px black;">' + whon + '</div></div>';
            overlay.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:linear-gradient(135deg, rgba(255,215,0,0.5), rgba(255,100,0,0.5)); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:999999; text-align:center;';
            document.body.appendChild(overlay);
            log('✅ Overlay créé et ajouté au DOM');
            
            // EFFET 2: Animation sur l'avatar
            log('🎭 Animation de l\'avatar...');
            var avatar = document.getElementById('avatar');
            avatar.style.cssText += '; border: 6px solid gold !important; box-shadow: 0 0 50px gold, 0 0 100px orange !important; transform: scale(1.2); transition: all 0.3s ease-out;';
            
            // EFFET 3: Particules
            log('✨ Création des particules...');
            createParticles(avatar);
            
            // Nettoyage
            setTimeout(function() {
                log('🧹 Suppression de l\'overlay...');
                overlay.remove();
                avatar.style.cssText = '';
                log('✅ Animation terminée');
            }, 3000);
        }
        
        function createParticles(element) {
            var rect = element.getBoundingClientRect();
            var x = rect.left + rect.width / 2;
            var y = rect.top + rect.height / 2;
            
            var colors = ['#FFD700', '#FFA500', '#FF6B6B', '#4D96FF', '#6BCB77'];
            
            for (var i = 0; i < 20; i++) {
                var particle = document.createElement('div');
                particle.style.cssText = 'position:fixed; left:' + x + 'px; top:' + y + 'px; width:20px; height:20px; background:' + colors[i % colors.length] + '; border-radius:50%; pointer-events:none; z-index:999998; box-shadow: 0 0 20px ' + colors[i % colors.length] + ';';
                document.body.appendChild(particle);
                
                var angle = (i / 20) * Math.PI * 2;
                var distance = 150;
                var tx = Math.cos(angle) * distance;
                var ty = Math.sin(angle) * distance;
                
                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: 'translate(' + tx + 'px, ' + ty + 'px) scale(0)', opacity: 0 }
                ], {
                    duration: 1500,
                    easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
                });
                
                setTimeout(function(p) { p.remove(); }, 1500, particle);
            }
            
            log('✅ ' + '20 particules créées');
        }
        
        log('📱 Page chargée - Cliquez sur le bouton pour tester');
    </script>
</body>
</html>
