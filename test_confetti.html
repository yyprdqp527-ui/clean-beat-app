<!DOCTYPE html>
<html>
<head>
    <title>Test Animation Confettis</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        button {
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #333;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        h1 { color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        #log { 
            margin-top: 20px; 
            padding: 20px; 
            background: rgba(255,255,255,0.9); 
            border-radius: 12px;
            max-width: 80%;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🎉 Test Animation Confettis 🎉</h1>
    <button onclick="lancerAnimation()">CLIQUEZ ICI POUR TESTER</button>
    <div id="log"></div>

    <script>
        function log(msg) {
            console.log(msg);
            document.getElementById('log').innerHTML += msg + '<br>';
        }

        function lancerAnimation() {
            log('🚀 Animation lancée!');
            createMegaConfetti(50);
            playEpicSound();
        }

        // === SYSTÈME DE CÉLÉBRATION EXPLOSIF ===
        function createMegaConfetti(count) {
            log('🎊🎊🎊 createMegaConfetti appelé avec count: ' + count);
            count = count || 50;
            var colors = ['#FFD700', '#FF6B9D', '#4ECDC4', '#45B7D1', '#FFA07A', '#FF4500', '#00FF00', '#FF00FF'];
            var centerX = window.innerWidth / 2;
            var centerY = window.innerHeight / 2;
            
            // 🌟 FLASH VISUEL IMPOSSIBLE À RATER
            var flash = document.createElement('div');
            flash.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,215,0,0.6);z-index:99999;pointer-events:none;';
            document.body.appendChild(flash);
            log('⚡ Flash créé!');
            setTimeout(function() { flash.style.transition = 'opacity 0.5s'; flash.style.opacity = '0'; }, 100);
            setTimeout(function() { flash.remove(); }, 600);
            
            // 🎉 TEXTE DE VICTOIRE CENTRAL
            var victoryText = document.createElement('div');
            victoryText.innerHTML = '🎉 BRAVO ! 🎉';
            victoryText.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;color:#FFD700;text-shadow:0 0 20px #FF6B00,0 0 40px #FFD700,0 4px 8px rgba(0,0,0,0.5);z-index:100000;pointer-events:none;';
            document.body.appendChild(victoryText);
            log('📝 Texte BRAVO créé!');
            setTimeout(function() { victoryText.style.transition = 'opacity 0.5s, transform 0.5s'; victoryText.style.opacity = '0'; victoryText.style.transform = 'translate(-50%,-50%) scale(0.5)'; }, 1500);
            setTimeout(function() { victoryText.remove(); }, 2000);
            
            for (var i = 0; i < count; i++) {
                (function(index) {
                    setTimeout(function() {
                        var confetti = document.createElement('div');
                        var size = 10 + Math.random() * 10;
                        var color = colors[Math.floor(Math.random() * colors.length)];
                        var startX = centerX + (Math.random() - 0.5) * 50;
                        var startY = centerY + (Math.random() - 0.5) * 50;
                        
                        confetti.style.cssText = 'position:fixed;width:' + size + 'px;height:' + size + 'px;background:' + color + ';left:' + startX + 'px;top:' + startY + 'px;border-radius:' + (Math.random() > 0.5 ? '50%' : '3px') + ';pointer-events:none;z-index:100001;box-shadow:0 0 6px ' + color + ';';
                        document.body.appendChild(confetti);
                        
                        var angle = (Math.random() * 360) * Math.PI / 180;
                        var velocity = 300 + Math.random() * 400;
                        var endX = startX + Math.cos(angle) * velocity;
                        var endY = startY + Math.sin(angle) * velocity - 200;
                        var duration = 1200 + Math.random() * 800;
                        var rotation = Math.random() * 1080;
                        
                        confetti.style.transition = 'all ' + duration + 'ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                        setTimeout(function() {
                            confetti.style.left = endX + 'px';
                            confetti.style.top = endY + 'px';
                            confetti.style.opacity = '0';
                            confetti.style.transform = 'rotate(' + rotation + 'deg) scale(0.3)';
                        }, 20);
                        
                        setTimeout(function() { confetti.remove(); }, duration + 100);
                    }, index * 15);
                })(i);
            }
            log('🎊🎊🎊 ' + count + ' confettis lancés!');
        }

        function playEpicSound() {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                [523.25, 659.25, 783.99, 1046.50].forEach(function(freq, i) {
                    setTimeout(function() {
                        var osc = ctx.createOscillator();
                        var gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = freq;
                        osc.type = 'triangle';
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    }, i * 100);
                });
                log('🔊 Son joué!');
            } catch(e) {
                log('⚠️ Son non disponible: ' + e);
            }
        }
        
        log('✅ Page de test prête - cliquez sur le bouton!');
    </script>
</body>
</html>
