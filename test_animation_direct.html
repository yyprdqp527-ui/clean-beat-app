<!DOCTYPE html>
<html>
<head>
    <title>Test Animation Direct</title>
    <script>
        // Ouvrir cette page sur http://localhost:8000/test_animation_direct.html
        // puis exécuter dans la console:
        // testAnimation('pat@hotmail.com', 'Pat', 20);
        
        function testAnimation(email, name, points) {
            console.log('🧪 TEST ANIMATION');
            console.log('   Email:', email);
            console.log('   Nom:', name);
            console.log('   Points:', points);
            
            // Ouvrir la page menu dans un nouvel onglet
            const menuWindow = window.open('http://localhost:8000/menu', '_blank');
            
            // Attendre que la page soit chargée
            setTimeout(() => {
                // Injecter le test dans la page menu
                menuWindow.postMessage({
                    type: 'test_celebration',
                    email: email,
                    name: name,
                    points: points
                }, '*');
            }, 3000);
        }
        
        // Auto-test au chargement
        window.addEventListener('load', () => {
            console.log('🚀 Page de test chargée');
            console.log('📝 Pour tester, exécutez dans la console:');
            console.log('   testAnimation("pat@hotmail.com", "Pat", 20);');
            console.log('   testAnimation("marie@hotmail.com", "Marie", 15);');
        });
    </script>
</head>
<body>
    <h1>Test Animation Célébration</h1>
    <p>Ouvrez la console (F12) et tapez:</p>
    <code>testAnimation('pat@hotmail.com', 'Pat', 20);</code>
    <br><br>
    <button onclick="testAnimation('pat@hotmail.com', 'Pat', 20)">Tester Pat (20 pts)</button>
    <br><br>
    <button onclick="testAnimation('marie@hotmail.com', 'Marie', 15)">Tester Marie (15 pts)</button>
</body>
</html>
