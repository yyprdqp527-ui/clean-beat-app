<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Clean Beat{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- PWA: manifest + meta tags pour mode plein écran -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CleanBeat">
    <meta name="theme-color" content="#597176">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='points_style.css') }}">
    <!-- Import Google Fonts Montserrat pour toute l'appli -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 🚨 ANTI-ZOOM MOBILE - FORCER LARGEUR ÉCRAN */
        html {
            overflow-x: hidden !important;
            max-width: 100vw !important;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        
        body {
            overflow-x: hidden !important;
            max-width: 100vw !important;
            width: 100% !important;
        }
        
        /* Empêcher tout élément de dépasser */
        img, video, iframe, table, form, div, section, article, aside, header, footer, nav, main {
            max-width: 100% !important;
        }

        /* Images PNG responsives (mobile-friendly) */
        img[src$=".png"] {
            max-width: 100%;
            height: auto;
            display: block;
        }

        :root { 
            --avatar-size: 88px;
            --teal-light:#A6D3DC;
            --teal-dark:#597176;
            --header-padding-vertical: 14px;
            --header-padding-horizontal: 28px;
            --header-total-height: 80px;
            --header-spacing-bottom: 4px;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--teal-light) 0%, var(--teal-dark) 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            padding-bottom: 0;
        }

        /* Game Header harmonisé */
        .header-menu { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:nowrap; background: rgba(255,255,255,0.24); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px); padding: var(--header-padding-vertical) var(--header-padding-horizontal); border-radius: 0 0 24px 24px; box-shadow: 0 12px 50px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.35); color:#153036; position:fixed; top:0; left:0; right:0; z-index:2000; box-sizing:border-box; border: 1px solid rgba(255,255,255,0.55); }
        .header-inner { width:100%; max-width:880px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:12px; padding:0 8px; }
        .avatar-strip { display:flex; gap:15px; align-items:center; justify-content:center; }
        /* Deux joueurs: espacement réduit pour mobile */
        .avatar-strip.two-players { gap: 50px; }
        .header-left, .header-right { position: relative; z-index: 2001; display:flex; align-items:center; gap:12px; flex:0 0 auto; }
        .avatar-col { display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 var(--avatar-size); max-width: var(--avatar-size); width: var(--avatar-size); box-sizing: border-box; }
        .avatar-row { display:flex; align-items:center; gap:8px; flex:0 0 auto; position: relative; }
        .avatar-name { text-align:center; color:#153036; max-width: calc(var(--avatar-size) * 1.8); font-size:12px; font-weight:800; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow: 0 1px 3px rgba(255,255,255,0.8); letter-spacing: 0.3px; }
        .avatar-square { position: relative; z-index: 2002; width: var(--avatar-size, 80px); height: var(--avatar-size, 80px); border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #ffffff 0%, #fefefe 100%); box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 2px solid rgba(255,255,255,0.6); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .avatar-square:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 15px 45px rgba(0,0,0,0.22), 0 0 0 4px rgba(255,255,255,0.45); border-color: rgba(255,255,255,0.8); }
        .avatar-square img { width:100%; height:100%; object-fit:cover; display:block; }
        .avatar-square-wrapper { position: relative; display: inline-block; overflow: visible; }
        .avatar-square-wrapper .vbar { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); height: calc(var(--avatar-size) - 8px); width:6px; border-radius:999px; background: linear-gradient(180deg, rgba(21,48,54,0.06), rgba(21,48,54,0.10)); overflow:hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); border: 1px solid rgba(21,48,54,0.22); z-index:2100; }
        .avatar-square-wrapper .vbar .vbar-fill { transition: height 0.4s ease; box-shadow: 0 0 6px rgba(0,0,0,0.12); left:0; right:0; bottom:0; position:absolute; }
        
        /* Barre horizontale pour mobile */
        .vbar-horizontal { display: none; width: 100%; height: 4px; border-radius: 999px; background: linear-gradient(90deg, rgba(230,235,240,0.8) 0%, rgba(210,220,230,0.9) 100%); overflow: hidden; position: relative; margin-top: 2px; }
        .vbar-horizontal .vbar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .vbar { width:10px; min-width:10px; height: calc(var(--avatar-size, 80px) - 6px); border-radius:999px; background: linear-gradient(180deg, rgba(230,235,240,0.8) 0%, rgba(210,220,230,0.9) 100%); overflow:hidden; box-shadow: inset 0 2px 6px rgba(0,0,0,0.12), 0 3px 10px rgba(0,0,0,0.1), 0 0 0 2px rgba(253,174,84,0.15); border: 2px solid rgba(253,174,84,0.3); display:inline-block; position: relative; transition: all 0.3s ease; }
        .vbar-fill { position: absolute; left: 0; right: 0; bottom: 0; width:100%; height:0%; transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 20px currentColor, 0 -3px 12px rgba(255,255,255,0.4), inset 0 2px 6px rgba(255,255,255,0.5); border-radius: 999px; filter: saturate(1.3) brightness(1.1); }
        .avatar-points { text-align: center; font-size: 11px; font-weight: 700; color: #153036; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }
        .daily-chip { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:800; color:#153036; background: rgba(255,255,255,0.85); border:1px solid rgba(21,48,54,0.15); border-radius:999px; padding:4px 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .daily-chip .dot { width:6px; height:6px; border-radius:50%; background: #FDAE54; display:inline-block; }
        .daily-chip .bar { width:60px; height:6px; border-radius:999px; background: rgba(21,48,54,0.12); overflow:hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); }
        .daily-chip .bar-fill { height:100%; background: linear-gradient(90deg, #FDAE54, #F4C68D); width:0%; transition: width 0.4s ease; }
        /* Media queries pour mobile et tablette */
        @media (max-width: 520px) { 
            .header-menu { padding: 10px 12px; } 
            .header-inner { max-width: calc(100% - 32px); padding: 0 16px; } 
            .avatar-strip { gap: 12px; } 
            .avatar-strip.two-players { gap: 25px !important; } 
            .avatar-col { max-width: var(--avatar-size); } 
        }
        
        /* 📱 MOBILE HARMONISÉ - Layout vertical compact */
        @media (max-width: 520px) {
            .header-menu { padding: 8px 4px; }
            .header-inner { max-width: 100%; padding: 0 2px; justify-content: center; }
            .avatar-strip { gap: 4px; flex-wrap: nowrap; overflow-x: visible; width: 100%; justify-content: space-evenly; }
            .avatar-strip.two-players { gap: 20px !important; }
            .avatar-col { 
                max-width: none; 
                min-width: var(--avatar-size); 
                flex: 0 0 var(--avatar-size); 
                gap: 3px;
            }
            .avatar-row { 
                flex-direction: column;
                gap: 3px;
                align-items: center;
            }
            /* Permettre noms longs sur mobile avec retour ligne */
            .avatar-name { 
                white-space: nowrap; 
                max-width: var(--avatar-size); 
                min-width: var(--avatar-size);
                line-height: 1.1; 
                font-size: 8px;
                word-break: normal;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* Cacher la barre verticale et afficher la barre horizontale */
            .avatar-square-wrapper .vbar { display: none !important; }
            .vbar-horizontal { display: block !important; }
            /* Points sous la barre */
            .avatar-points {
                font-size: 8px !important;
                margin-top: 1px;
            }
            
            /* Réduire les conteneurs principaux sur mobile */
            .container, .main-container {
                max-width: 100% !important;
                padding: 10px !important;
            }
            
            h1 {
                font-size: 20px !important;
            }
        }
        
        @media (max-width: 400px) {
            .avatar-strip { gap: 3px; }
            .avatar-strip.two-players { gap: 15px !important; }
            .avatar-name { 
                font-size: 7px;
                max-width: var(--avatar-size);
            }
            .avatar-points { font-size: 7px !important; }
            .vbar-horizontal { height: 3px; }
            
            h1 {
                font-size: 18px !important;
            }
        }
        
        /* Adaptation spéciale pour iPhone et petits écrans */
        @media (max-width: 430px) {
            :root {
                --avatar-size: 60px;
            }
            .avatar-square { border-radius: 12px; }
        }
        
        @media (max-width: 390px) {
            :root {
                --avatar-size: 56px;
            }
            .avatar-square { border-radius: 10px; }
        }
        
        @media (max-width: 360px) {
            :root {
                --avatar-size: 52px;
            }
        }
        
        /* iPad et tablettes en portrait (768px - 1024px) */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .header-menu { padding: 12px 20px; }
            .header-inner { max-width: 700px; }
        }
        
        /* iPad et tablettes en paysage */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
            .header-menu { padding: 14px 24px; }
            .header-inner { max-width: 800px; }
        }

        /* Joueurs avec logo au milieu */
        .players-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap; /* keep items on single line, allow scroll */
            width: 100%;
            overflow-x: auto;
            padding: 8px 12px;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: transparent;
            padding: 10px;
            color: #333;
            font-weight: bold;
            flex: 0 0 auto;
            min-width: 130px;
        }

        .player-name {
            font-size: 12px;
            color: #333;
            font-weight: bold;
            text-align: center;
        }

        /* Maison centrale avec animations */
        .house-central {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 200px;
        }

        .house-avatar {
            font-size: 60px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Animations de la maison */
        .house-avatar[data-mood="happy"] {
            animation: bounce 0.6s ease-in-out;
            transform: scale(1.1);
        }

        .house-avatar[data-mood="sad"] {
            animation: shake 0.6s ease-in-out;
            opacity: 0.7;
        }

        .house-avatar[data-mood="excited"] {
            animation: bounce 0.6s ease-in-out infinite;
        }

        .house-avatar[data-mood="waiting"] {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 20%, 60%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px) scale(1.1); }
            80% { transform: translateY(-10px) scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .house-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 5px 0;
        }

        /* Barre de progression */
        .house-progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(200, 200, 200, 0.8);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 2px 4px rgba(76, 175, 80, 0.3);
        }

        .progress-text {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            color: #666;
        }

        /* Compteur journalier */
        .daily-counter {
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            background: rgba(102, 126, 234, 0.1);
            padding: 8px 15px;
            border-radius: 15px;
            margin-top: 5px;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .daily-counter span {
            color: #FF6B6B;
            font-size: 16px;
        }

        /* Conteneur pour nommer la maison */
        .name-house-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .name-house-container input {
            padding: 10px 15px;
            pointer-events: none;
            z-index: 1000;
            animation: pointsFloat 2s ease-out forwards;
        }

        @keyframes pointsFloat {
            0% { transform: translateX(-50%) translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateX(-50%) translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateX(-50%) translateY(-100px) scale(1); opacity: 0; }
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: transparent;
            padding: 6px;
            color: #333;
            font-weight: bold;
            flex: 0 0 auto;
            min-width: calc(var(--avatar-size) + 24px);
        }

        .player-card img {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 12px;
            border: 3px solid white;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        /* Global burger button style for touch targets (uniform across pages) */
        .burger-btn {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255,255,255,0.95);
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .burger-lines {
            width: 28px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .burger-lines span {
            display: block;
            height: 4px;
            width: 100%;
            background: #597176;
            border-radius: 2px;
        }

        .player-points {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        /* Points du joueur de gauche */
        .players-display > .player-card:first-child .player-points {
            background-color: #345169;
        }

        /* Points du joueur de droite (troisième élément) */
        .players-display > .player-card:nth-child(3) .player-points {
            background-color: #EE752A;
        }

        .logo-middle {
            width: 130px;
            height: 130px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .invite-player-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px;
            cursor: pointer;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            border: 2px dashed rgba(102, 126, 234, 0.5);
            transition: all 0.3s;
            min-width: 130px;
        }

        .invite-player-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.8);
        }

        .invite-player-btn .invite-icon {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            background: rgba(102, 126, 234, 0.2);
            border: 3px solid rgba(102, 126, 234, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(102, 126, 234, 0.8);
        }

        .invite-player-btn .invite-text {
            font-size: 12px;
            font-weight: bold;
            color: rgba(102, 126, 234, 0.8);
            text-align: center;
        }

        .house-code-header {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: block;
            width: fit-content;
            margin: 15px auto 0;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .house-code-header span {
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* Navigation compacte */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        /* Titre principal */
        h1 {
            text-align: center;
            color: white;
            font-size: 32px;
            margin: 25px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            header {
                padding: 12px;
            }

            .players-display {
                gap: 10px;
            }

            .player-card img {
                width: 70px;
                height: 70px;
                border-radius: 8px;
                border: 2px solid white;
            }

            .logo-middle {
                width: 80px;
                height: 80px;
            }

            .player-points {
                font-size: 12px;
            }

            .invite-player-btn .invite-icon {
                width: 70px;
                height: 70px;
                border-radius: 8px;
                font-size: 30px;
            }

            .invite-player-btn .invite-text {
                font-size: 10px;
            }

            .house-code-header {
                font-size: 10px;
                padding: 6px 15px;
                margin-top: 12px;
            }

            .house-code-header span {
                font-size: 14px;
            }

            h1 {
                font-size: 24px;
                margin: 20px 0;
            }
        }

        
    </style>
    {% block extra_styles %}{% endblock %}
    {% block page_styles %}{% endblock %}
    
    <!-- 🔔 Script Push Notifications -->
    <script src="{{ url_for('static', filename='push-notifications.js') }}" defer></script>
</head>
<body>
{% if menu_page %}
  {% include '_game_header.html' %}
{% endif %}

<!-- Bouton retour vers le menu (affiché sur toutes les pages sauf le menu) -->


{% block content %}{% endblock %}

<script>
// Variables globales pour la maison
let houseMessages = {
    encouragement: [
        "Excellent travail ! 🌟", 
        "Vous êtes formidables ! 💪", 
        "Continue comme ça ! 🎉",
        "Bravo mes champions ! 🏆",
        "Vous faites du super boulot ! ✨"
    ],
    blame: [
        "Allez, un petit effort ! 🤔", 
        "La maison a besoin de vous ! 🏠", 
        "Ne m'abandonnez pas ! 😊",
        "Un peu de motivation s'il vous plaît ! 💭",
        "J'attends vos efforts ! ⏰"
    ],
    celebration: [
        "FANTASTIQUE ! 🎊", 
        "Vous êtes les meilleurs ! 🌟", 
        "Mission accomplie ! 🎯",
        "Extraordinaire ! 🚀",
        "Je suis si fière de vous ! 💖"
    ]
};

let lastActivityTime = Date.now();
let inactivityTimer;
let audioContext;

// Initialiser l'audio context
function initAudioContext() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioContext;
}

// Fonction pour jouer un son avec Web Audio API
function playSound(type) {
    try {
        const ctx = initAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        if (type === 'pointsSound') {
            // Son de points gagnés (notes montantes)
            oscillator.frequency.setValueAtTime(523.25, ctx.currentTime); // Do
            oscillator.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // Mi
            oscillator.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // Sol
            oscillator.type = 'triangle';
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.5);
        } else if (type === 'happySound') {
            // Son de célébration (mélodie joyeuse)
            oscillator.frequency.setValueAtTime(523.25, ctx.currentTime); // Do
            oscillator.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15); // Mi
            oscillator.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3); // Sol
            oscillator.frequency.setValueAtTime(1046.5, ctx.currentTime + 0.45); // Do aigu
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.8);
        }
    } catch (e) {
        console.log('Son non disponible:', e);
    }
}

// Fonction pour nommer la maison
function nameHouse() {
    const houseName = document.getElementById('houseName').value.trim();
    if (houseName.length === 0) {
        alert('Veuillez entrer un nom pour votre maison !');
        return;
    }
    
    fetch('/name_house', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ house_name: houseName })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            location.reload();
            showHouseMessage("Bienvenue dans la maison " + houseName + " ! 🏠✨", "celebration");
        }
    })
    .catch(error => console.error('Error:', error));
}

// Fonction pour afficher un message de la maison
function showHouseMessage(message, type) {
    const messageDiv = document.getElementById('houseMessage');
    if (!messageDiv) return;
    
    messageDiv.textContent = message;
    messageDiv.className = `house-message ${type}`;
    
    setTimeout(() => {
        messageDiv.textContent = '';
        messageDiv.className = 'house-message';
    }, 4000);
}

// Fonction pour animer la maison
function animateHouse(mood) {
    const houseAvatar = document.getElementById('houseAvatar');
    if (!houseAvatar) return;
    
    houseAvatar.setAttribute('data-mood', mood);
    
    setTimeout(() => {
        if (mood !== 'waiting') {
            houseAvatar.setAttribute('data-mood', 'neutral');
        }
    }, 2000);
}

// Fonction pour afficher l'animation de points
function showPointsAnimation(points) {
    const pointsDiv = document.createElement('div');
    pointsDiv.className = 'points-animation';
    pointsDiv.textContent = '+' + points + ' points!';
    document.body.appendChild(pointsDiv);
    
    setTimeout(() => {
        document.body.removeChild(pointsDiv);
    }, 2000);
}

// Fonction appelée quand une tâche est complétée
function onTaskCompleted(points) {
    lastActivityTime = Date.now();
    
    // Animation de points
    showPointsAnimation(points);
    
    // Son de réussite
    playSound('pointsSound');
    
    // Animation de la maison heureuse
    animateHouse('happy');
    
    // Message d'encouragement
    const messages = houseMessages.encouragement;
    const randomMessage = messages[Math.floor(Math.random() * messages.length)];
    showHouseMessage(randomMessage, 'encouragement');
    
    // Mettre à jour la barre de progression (simulation)
    updateHouseProgress();
}

// Fonction pour mettre à jour la progression de la maison
function updateHouseProgress() {
    const progressFill = document.querySelector('.progress-fill');
    if (!progressFill) return;
    
    const currentWidth = parseInt(progressFill.style.width) || 0;
    const newWidth = Math.min(currentWidth + 5, 100);
    progressFill.style.width = newWidth + '%';
    
    const progressText = document.querySelector('.progress-text');
    if (progressText) {
        progressText.textContent = newWidth + '%';
    }
    
    // Si la maison atteint 100%, célébration spéciale
    if (newWidth >= 100) {
        setTimeout(() => {
            animateHouse('excited');
            const celebrationMessage = houseMessages.celebration[Math.floor(Math.random() * houseMessages.celebration.length)];
            showHouseMessage(celebrationMessage, 'celebration');
            playSound('happySound');
        }, 500);
    }
}

// Fonction pour vérifier l'inactivité
function checkInactivity() {
    const timeSinceLastActivity = Date.now() - lastActivityTime;
    const inactiveThreshold = 120000; // 2 minutes
    
    if (timeSinceLastActivity > inactiveThreshold) {
        // Animation de la maison triste
        animateHouse('sad');
        
        // Message de motivation
        const messages = houseMessages.blame;
        const randomMessage = messages[Math.floor(Math.random() * messages.length)];
        showHouseMessage(randomMessage, 'blame');
        
        // Réinitialiser le timer
        lastActivityTime = Date.now();
    }
}

// Démarrer la surveillance d'inactivité
function startInactivityCheck() {
    inactivityTimer = setInterval(checkInactivity, 30000); // Vérifier toutes les 30 secondes
}

// Fonction pour copier le lien d'invitation
function copyInviteLink() {
    const baseUrl = window.location.origin;
    const registerUrl = baseUrl + "{{ url_for('register') }}";
    const inviteLink = registerUrl + "?house_code={{ house_code }}";
    
    navigator.clipboard.writeText(inviteLink).then(function() {
        const btn = event.target.closest('.invite-player-btn');
        const originalText = btn.querySelector('.invite-text').textContent;
        btn.querySelector('.invite-text').textContent = 'Lien copié !';
        btn.style.background = 'rgba(76, 175, 80, 0.2)';
        btn.style.borderColor = 'rgba(76, 175, 80, 0.8)';
        
        setTimeout(function() {
            btn.querySelector('.invite-text').textContent = originalText;
            btn.style.background = 'rgba(102, 126, 234, 0.1)';
            btn.style.borderColor = 'rgba(102, 126, 234, 0.5)';
        }, 2000);
    }).catch(function(err) {
        console.error('Erreur lors de la copie:', err);
        alert('Lien d\'invitation: ' + inviteLink);
    });
}

// Initialisation au chargement de la page
document.addEventListener('DOMContentLoaded', function() {
    // Démarrer la surveillance d'inactivité
    startInactivityCheck();
    
    // Message de bienvenue initial
    setTimeout(() => {
        const houseAvatar = document.getElementById('houseAvatar');
        if (houseAvatar) {
            showHouseMessage("Bienvenue ! Commencez vos tâches pour faire grandir votre maison ! 🏠✨", "encouragement");
        }
    }, 1000);
    
    // Ajouter des événements de clic sur les zones de la maison
    const houseRects = document.querySelectorAll('svg rect');
    houseRects.forEach(rect => {
        rect.addEventListener('click', function() {
            lastActivityTime = Date.now(); // Marquer l'activité
        });
    });

    // Appliquer la largeur initiale de la barre de santé depuis l'attribut data-health
    const healthBar = document.getElementById('houseHealthBar');
    if (healthBar) {
        const h = healthBar.getAttribute('data-health');
        if (h !== null) {
            healthBar.style.width = (parseInt(h, 10) || 0) + '%';
            const healthText = document.getElementById('houseHealthText');
            if (healthText) healthText.textContent = (parseInt(h, 10) || 0) + '%';
        }
    }
});

// Fonction pour simuler la complétion d'une tâche (pour test)
function simulateTaskCompletion() {
    onTaskCompleted(Math.floor(Math.random() * 20) + 10);
}

// Afficher un challenge aléatoire de la maison
function showHouseChallenge() {
    const challengeDiv = document.getElementById('houseChallenge');
    if (!challengeDiv) return;
    const challenges = houseMessages.challenge;
    const random = challenges[Math.floor(Math.random() * challenges.length)];
    challengeDiv.textContent = random;
    challengeDiv.style.display = 'block';
    setTimeout(() => { challengeDiv.style.display = 'none'; }, 10000);
}

// Sonnerie lors de la création d'une tâche
function playTaskCreatedSound() {
    try {
        const ctx = initAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.25);
    } catch (e) { console.log('Sonnerie non disponible', e); }
}

// Fonction pour afficher un message de la maison
function showHouseMessage(message, type) {
    const messageDiv = document.getElementById('houseMessage');
    if (!messageDiv) return;
    messageDiv.textContent = message;
    messageDiv.className = `house-message ${type}`;
    // Laisse le message visible plus longtemps si c'est un blame
    setTimeout(() => {
        messageDiv.textContent = '';
        messageDiv.className = 'house-message';
    }, type === 'blame' ? 6000 : 4000);
}

// Fonction pour mettre à jour la santé de la maison
function updateHouseHealth(amount = 5) {
    const healthBar = document.getElementById('houseHealthBar');
    const healthText = document.getElementById('houseHealthText');
    if (!healthBar || !healthText) return;
    let current = parseInt(healthBar.style.width) || 0;
    let newVal = Math.max(0, Math.min(current + amount, 100));
    healthBar.style.width = newVal + '%';
    healthText.textContent = newVal + '%';
    if (newVal >= 100) {
        setTimeout(() => {
            animateHouse('excited');
            const celebrationMessage = houseMessages.celebration[Math.floor(Math.random() * houseMessages.celebration.length)];
            showHouseMessage(celebrationMessage, 'celebration');
            playSound('happySound');
        }, 500);
    }
    if (newVal <= 20) {
        showHouseMessage("Attention, la maison est malade ! 🏠🤒", 'blame');
    }
}

// Fonction appelée quand une tâche est complétée
function onTaskCompleted(points) {
    lastActivityTime = Date.now();
    showPointsAnimation(points);
    playSound('pointsSound');
    animateHouse('happy');
    const messages = houseMessages.encouragement;
    const randomMessage = messages[Math.floor(Math.random() * messages.length)];
    showHouseMessage(randomMessage, 'encouragement');
    updateHouseHealth(7); // Augmente la santé de la maison
    if (Math.random() < 0.3) showHouseChallenge(); // Parfois challenge
}

// Fonction à appeler lors de la création d'une nouvelle tâche
function onTaskCreated() {
    playTaskCreatedSound();
    showHouseMessage("Nouvelle tâche ajoutée ! La maison compte sur vous ! 🏠🔔", 'encouragement');
    showHouseChallenge();
}
        
</script>
