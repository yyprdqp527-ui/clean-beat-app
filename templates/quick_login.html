<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Connexion - Ménage à Deux</title>
    <!-- 🚨 FIX ANTI-ZOOM iOS Safari - CRITIQUE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/anti-zoom-ios.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2c3e50;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: bounceIn 0.8s ease-out;
        }

        .logo-mini {
            width: 120px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-title {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .login-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Bouton retour glassmorphisme */
        .back-btn-glass {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 2001;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(166,211,220,0.2) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #153036;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 12px 40px rgba(89, 113, 118, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .back-btn-glass:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(166,211,220,0.25) 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(89, 113, 118, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .back-btn-glass:active {
            transform: scale(0.95);
        }

        @media (max-width: 520px) {
            .back-btn-glass {
                top: 20px;
                left: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }

        .flash-messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .alert-success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: white;
        }

        .alert-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
        }

        .alert-warning {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #8b4513;
        }

        .alert-info {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #2c3e50;
        }

        .emoji-decoration {
            font-size: 1.5rem;
            margin: 0 5px;
        }

        /* Animations */
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .login-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo mini -->
        <img src="{{ url_for('static', filename='images/Ménage à Deux.png') }}" 
             alt="Ménage à Deux" 
             class="logo-mini">

        <!-- Titre -->
        <h1 class="login-title">
            <span class="emoji-decoration">🏠</span>
            Bon retour !
            <span class="emoji-decoration">✨</span>
        </h1>
        <p class="login-subtitle">
            Reconnectez-vous pour continuer votre aventure ménage !
        </p>

        {% include '_flash_popup.html' %}

        <!-- Formulaire de connexion -->
        <form method="POST" id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">
                    📧 Email
                </label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       class="form-input" 
                       placeholder="votre@email.com"
                       required
                       autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    🔒 Mot de passe
                </label>
                <input type="password" 
                       id="password" 
                       name="password" 
                       class="form-input" 
                       placeholder="Votre mot de passe"
                       required
                       autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn" id="submitBtn">
                🚀 Se connecter !
            </button>
        </form>

        <!-- Lien retour -->
        <a href="{{ url_for('home') }}" class="back-btn-glass" aria-label="Retour">←</a>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const container = document.querySelector('.login-container');

            // Animation du formulaire
            form.addEventListener('submit', function(e) {
                submitBtn.textContent = '🔄 Connexion...';
                submitBtn.style.background = 'linear-gradient(135deg, #a8a8a8 0%, #888 100%)';
            });

            // Validation côté client
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (!this.value.trim()) {
                        this.style.borderColor = '#ff6b6b';
                        this.style.boxShadow = '0 0 10px rgba(255, 107, 107, 0.3)';
                    } else {
                        this.style.borderColor = '#84fab0';
                        this.style.boxShadow = '0 0 10px rgba(132, 250, 176, 0.3)';
                    }
                });

                input.addEventListener('focus', function() {
                    this.style.borderColor = '#667eea';
                    this.style.boxShadow = '0 0 15px rgba(102, 126, 234, 0.3)';
                });
            });

            // Effet shake en cas d'erreur
            const alerts = document.querySelectorAll('.alert-danger');
            if (alerts.length > 0) {
                container.classList.add('shake');
                setTimeout(() => {
                    container.classList.remove('shake');
                }, 500);
            }

            // Son au clic
            submitBtn.addEventListener('click', function() {
                try {
                    const context = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = context.createOscillator();
                    const gainNode = context.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(context.destination);
                    
                    oscillator.frequency.value = 600;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.1, context.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.3);
                    
                    oscillator.start(context.currentTime);
                    oscillator.stop(context.currentTime + 0.3);
                } catch (e) {
                    // Son non disponible
                }
            });

            // Auto-focus sur le premier champ
            document.getElementById('email').focus();

            console.log('🏠 Page de connexion Ménage à Deux chargée ! ✨');
        });
    </script>
</body>
</html>
