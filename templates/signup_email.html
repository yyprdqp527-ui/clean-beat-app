<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Inscription avec Email - Ménage à Deux</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #A6D3DC 0%, #597176 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* Header avec titre - style create_profile */
        .page-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(253,174,84,0.15) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(253,174,84,0.3);
            box-shadow: 0 8px 32px rgba(89,113,118,0.15);
            max-width: 450px;
            width: 100%;
        }
        
        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: #153036;
            margin: 0;
        }
        
        .page-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(21, 48, 54, 0.15));
        }

        .container {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(166,211,220,0.2) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 24px;
            border-radius: 28px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            max-width: 450px;
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
            background: #fafafa;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #597176;
            background: white;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            line-height: 1.4;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: white;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(253, 174, 84, 0.4);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 174, 84, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-btn-glass {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 2001;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(166,211,220,0.2) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #153036;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 12px 40px rgba(89, 113, 118, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .back-btn-glass:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(166,211,220,0.25) 100%);
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(89, 113, 118, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .back-btn-glass:active {
            transform: scale(0.95);
        }

        @media (max-width: 520px) {
            .back-btn-glass {
                top: 20px;
                left: 20px;
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .back-link a {
            color: #597176;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Messages flash */
        .flash {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash.danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .flash.warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
                max-width: 100%;
            }

            h1 {
                font-size: 24px;
            }

            .submit-btn {
                padding: 15px;
                font-size: 16px;
            }
        }
        
        /* iPad et tablettes */
        @media (min-width: 768px) and (max-width: 1024px) {
            .container {
                max-width: 550px;
                padding: 45px 35px;
            }

            h1 {
                font-size: 32px;
            }

            input[type="email"],
            input[type="password"],
            input[type="text"] {
                padding: 16px;
                font-size: 17px;
            }

            .submit-btn {
                padding: 20px;
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

<!-- Header avec titre - style create_profile -->
<div class="page-header">
    <div class="page-icon">📝</div>
    <h1 class="page-title">Créer votre compte</h1>
</div>

<div class="container">
    {% include '_flash_popup.html' %}

    <form method="post">
        <div class="form-group">
            <label for="name">Prénom</label>
            <input type="text" id="name" name="name" required 
                   placeholder="Votre prénom">
        </div>

        <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" required 
                   placeholder="votre@email.com">
        </div>

        <div class="form-group">
            <label for="password">Créer votre mot de passe</label>
            <input type="text" id="password" name="password" required
                   placeholder="Mot de passe suggéré"
                   style="width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #e0e0e0; font-size: 16px; background: #fafafa; transition: border-color 0.3s; font-family: monospace;">
        </div>

        <button type="submit" class="submit-btn">
            Créer mon compte
        </button>
    </form>

    <script>
        const passwordInput = document.getElementById('password');

        function generateStrongPassword() {
            const uppercase = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const lowercase = 'abcdefghijkmnopqrstuvwxyz';
            const numbers = '23456789';
            const special = '!@#$%&*';
            const all = uppercase + lowercase + numbers + special;
            
            let password = '';
            password += uppercase[Math.floor(Math.random() * uppercase.length)];
            password += lowercase[Math.floor(Math.random() * lowercase.length)];
            password += numbers[Math.floor(Math.random() * numbers.length)];
            password += special[Math.floor(Math.random() * special.length)];
            
            for (let i = 4; i < 16; i++) {
                password += all[Math.floor(Math.random() * all.length)];
            }
            
            return password.split('').sort(() => Math.random() - 0.5).join('');
        }

        // Générer et afficher le mot de passe au chargement
        window.addEventListener('DOMContentLoaded', () => {
            passwordInput.value = generateStrongPassword();
            passwordInput.select();
        });

        // Masquer le mot de passe quand on quitte le champ
        passwordInput.addEventListener('blur', function() {
            if (this.value) {
                this.type = 'password';
            }
            this.style.borderColor = '#e0e0e0';
            this.style.background = '#fafafa';
        });

        // Afficher en clair au focus
        passwordInput.addEventListener('focus', function() {
            this.type = 'text';
            this.style.borderColor = '#597176';
            this.style.background = 'white';
        });

        // Validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const pwd = passwordInput.value;
            if (!pwd || pwd.length < 8) {
                e.preventDefault();
                alert('Le mot de passe doit contenir au moins 8 caractères');
                return false;
            }
        });
    </script>

    <div class="back-link">
        <p><a href="{{ url_for('join_house') }}">Rejoindre une maison existante avec un code</a></p>
        <p>Vous avez déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
    </div>
</div>
<a href="{{ url_for('welcome') }}" class="back-btn-glass" aria-label="Retour">←</a>

</body>
</html>
