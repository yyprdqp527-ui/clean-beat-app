<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>QUI FAIT QUOI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:visible; }

    @font-face {
      font-family: 'Bubblegum Sans';
      src: url('/static/fonts/BubblegumSans.woff2') format('woff2');
      font-display: block;
    }

    body {
      background: {{ bg_gradient }};
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      padding-top: max(40px, env(safe-area-inset-top));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      cursor: pointer;
      font-family: 'Bubblegum Sans', cursive;
      position: relative;
    }

    .sp-bubble {
      position: fixed;
      border-radius: 50%;
      background: {% if bg_theme_light %}rgba(0,0,0,0.06){% else %}white{% endif %};
      opacity: 0;
      pointer-events: none;
    }
    .sp-b1 { width:220px; height:220px; top:-30px; right:-30px; animation:spBubble 0.8s ease 0.1s forwards; }
    .sp-b2 { width:120px; height:120px; bottom:40px; left:-20px; animation:spBubble 0.8s ease 0.3s forwards; }
    .sp-b3 { width:70px; height:70px; top:100px; left:20px; animation:spBubble 0.8s ease 0.2s forwards; }
    .sp-b4 { width:50px; height:50px; bottom:140px; right:20px; animation:spBubble 0.8s ease 0.45s forwards; }

    @keyframes spBubble {
      0%   { opacity:0; transform:scale(0); }
      60%  { opacity:0.2; transform:scale(1.15); }
      100% { opacity:0.14; transform:scale(1); }
    }

    .sp-glass {
      {% if bg_theme_light %}
      background: rgba(0,0,0,0.07);
      border: 2px solid rgba(0,0,0,0.12);
      {% else %}
      background: rgba(255,255,255,0.22);
      border: 2px solid rgba(255,255,255,0.5);
      {% endif %}
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center;
      width: 100%;
      max-width: 360px;
      opacity: 0;
      animation: spCardPop 0.5s cubic-bezier(.36,.07,.19,.97) 0.2s forwards;
      position: relative;
      z-index: 1;
    }
    @keyframes spCardPop {
      0%   { opacity:0; transform:scale(0.8); }
      70%  { opacity:1; transform:scale(1.03); }
      100% { opacity:1; transform:scale(1); }
    }

    .sp-t1 {
      font-family: 'Bubblegum Sans', cursive;
      font-size: 72px;
      color: {% if bg_theme_light %}#1a1008{% else %}white{% endif %};
      line-height: 0.9;
      opacity: 0;
      animation: spBounce 0.7s cubic-bezier(.36,.07,.19,.97) 0.6s forwards;
    }
    .sp-t2 {
      font-family: 'Bubblegum Sans', cursive;
      font-size: 52px;
      color: #CC1111;
      line-height: 0.95;
      opacity: 0;
      animation: spBounce 0.7s cubic-bezier(.36,.07,.19,.97) 1.2s forwards;
    }
    @keyframes spBounce {
      0%   { opacity:0; transform:scale(0.3) translateY(30px) rotate(-4deg); }
      55%  { opacity:1; transform:scale(1.18) translateY(-12px) rotate(3deg); }
      75%  { transform:scale(0.94) translateY(5px) rotate(-1deg); }
      100% { opacity:1; transform:scale(1) translateY(0) rotate(0); }
    }

    .sp-divider {
      width:50px; height:4px; border-radius:2px;
      background: {% if bg_theme_light %}rgba(0,0,0,0.15){% else %}rgba(255,255,255,0.3){% endif %};
      margin:12px 0 8px;
      opacity:0; transition:opacity 0.4s;
    }
    .sp-t3 {
      font-family: 'Bubblegum Sans', cursive;
      font-size: 26px;
      color: {% if bg_theme_light %}rgba(0,0,0,0.5){% else %}rgba(255,255,255,0.7){% endif %};
      line-height:1.3; min-height:34px;
    }
    .sp-t4 {
      font-family: 'Bubblegum Sans', cursive;
      font-size: 26px;
      color: {% if bg_theme_light %}#1a1008{% else %}white{% endif %};
      line-height:1.3; min-height:34px;
    }
    .sp-cursor {
      display:inline-block; width:3px;
      background:currentColor; margin-left:2px;
      vertical-align:middle;
      animation:spBlink 0.5s step-end infinite;
    }
    @keyframes spBlink { 0%,100%{opacity:1} 50%{opacity:0} }

    .sp-skip {
      position:fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%);
      font-family: 'Bubblegum Sans', cursive;
      font-size:14px;
      color: {% if bg_theme_light %}rgba(0,0,0,0.3){% else %}rgba(255,255,255,0.4){% endif %};
      opacity:0; transition:opacity 0.5s;
      white-space:nowrap;
    }
  </style>
</head>
<body onclick="goToMenu()">
  <div class="sp-bubble sp-b1"></div>
  <div class="sp-bubble sp-b2"></div>
  <div class="sp-bubble sp-b3"></div>
  <div class="sp-bubble sp-b4"></div>
  <div class="sp-glass">
    <div class="sp-t1">QUI FAIT QUOI</div>
    <div class="sp-t2">DANS LA BARAQUE</div>
    <div class="sp-divider" id="spDiv"></div>
    <div class="sp-t3">
      <span id="spLine3"></span>
      <span class="sp-cursor" id="spCur3" style="height:22px;display:none"></span>
    </div>
    <div class="sp-t4">
      <span id="spLine4"></span>
      <span class="sp-cursor" id="spCur4" style="height:22px;display:none"></span>
    </div>
  </div>
  <div class="sp-skip" id="spSkip">Appuie pour passer →</div>

  <script>
    function goToMenu() {
      window.location.href = '/menu?from_splash=1';
    }

    function spType(elId, curId, text, speed, cb) {
      var el = document.getElementById(elId);
      var cur = document.getElementById(curId);
      el.textContent = '';
      cur.style.display = 'inline-block';
      var i = 0;
      var t = setInterval(function() {
        el.textContent += text[i]; i++;
        if (i >= text.length) {
          clearInterval(t);
          setTimeout(function() {
            cur.style.display = 'none';
            if (cb) cb();
          }, 300);
        }
      }, speed);
    }

    function startTypewriter() {
      document.getElementById('spDiv').style.opacity = '1';
      spType('spLine3', 'spCur3', "C'est pas toi...", 65, function() {
        setTimeout(function() {
          spType('spLine4', 'spCur4', "alors c'est qui ?", 65, function() {
            setTimeout(function() {
              document.getElementById('spSkip').style.opacity = '1';
            }, 400);
          });
        }, 150);
      });
    }

    // t1 bounce finit à 1.3s, t2 bounce finit à 1.9s
    // Typewriter démarre à 2.1s
    setTimeout(startTypewriter, 2100);
    setTimeout(goToMenu, 5500);
  </script>
</body>
</html>
