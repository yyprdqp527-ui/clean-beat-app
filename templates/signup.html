<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Inscription - Ménage à Deux</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #A6D3DC 0%, #597176 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* 📱 MOBILE OPTIMISÉ */
        @media (max-width: 480px) {
            body {
                padding: 15px !important;
            }
            
            .container {
                padding: 25px 20px !important;
                border-radius: 18px !important;
            }
            
            h1 {
                font-size: 22px !important;
                margin-bottom: 20px !important;
            }
            
            .subtitle {
                font-size: 13px !important;
                margin-bottom: 20px !important;
            }
        }
        
        @media (max-width: 375px) {
            body {
                padding: 12px !important;
            }
            
            .container {
                padding: 20px 15px !important;
            }
            
            h1 {
                font-size: 20px !important;
            }
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }

        .social-buttons {
            margin-bottom: 30px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .facebook-btn {
            background: #1877F2;
            color: white;
        }

        .facebook-btn:hover {
            background: #166FE5;
            transform: translateY(-2px);
        }

        .google-btn {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #dadce0;
            transform: translateY(-2px);
        }

        .email-btn {
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: white;
        }

        .email-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 174, 84, 0.4);
        }

        .social-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .divider {
            margin: 25px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #666;
            font-size: 14px;
        }

        .login-link {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .login-link a {
            color: #597176;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Messages flash - Glassmorphisme harmonisé */
        .flash {
            margin-bottom: 20px;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 24px rgba(21, 48, 54, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .flash.success {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 215, 0, 0.2), rgba(253, 174, 84, 0.3));
            color: #153036;
            border: 1px solid rgba(253, 174, 84, 0.4);
        }

        .flash.danger {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 107, 107, 0.2), rgba(231, 76, 60, 0.15));
            color: #721c24;
            border: 1px solid rgba(255, 107, 107, 0.4);
        }

        .flash.warning {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(253, 174, 84, 0.3), rgba(244, 198, 141, 0.35));
            color: #153036;
            border: 1px solid rgba(253, 174, 84, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 24px;
            }

            .social-btn {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    {% include '_flash_popup.html' %}

    <h1>Créer votre compte</h1>
    <p class="subtitle">
        Inscrivez-vous avec votre email, Facebook ou Google pour commencer votre aventure ménage à deux !
    </p>

    <div class="social-buttons">
        <a href="{{ url_for('signup_facebook') }}" class="social-btn facebook-btn">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Continuer avec Facebook
        </a>

        <a href="{{ url_for('signup_google') }}" class="social-btn google-btn">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continuer avec Google
        </a>

        <div class="divider">
            <span>ou</span>
        </div>

        <a href="{{ url_for('signup_email') }}" class="social-btn email-btn">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            Continuer avec Email
        </a>
    </div>

    <div class="login-link">
        <p>Vous avez déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a></p>
    </div>
</div>

</body>
</html>
