<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Nommer votre foyer - TOG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 🚨 FIX ANTI-ZOOM iOS Safari - CRITIQUE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/anti-zoom-ios.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: {{ bg_gradient }};
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* Header avec titre - style glassmorphisme */
        .page-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(253,174,84,0.15) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(253,174,84,0.3);
            box-shadow: 0 8px 32px rgba(89,113,118,0.15);
            max-width: 450px;
            width: 100%;
        }
        
        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: #153036;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: -0.3px;
        }
        
        .page-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(21, 48, 54, 0.15));
        }

        .container {
            background: rgba(255, 255, 255, 0.24);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 12px 40px rgba(89,113,118,0.25);
            max-width: 450px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .progress-step {
            width: 40px;
            height: 5px;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .progress-step.active {
            background: #FDAE54;
            box-shadow: 0 0 10px rgba(253,174,84,0.5);
        }

        .subtitle {
            font-size: 15px;
            color: #153036;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #153036;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 2px solid rgba(253,174,84,0.3);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: 600;
            color: #153036;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #FDAE54;
            box-shadow: 0 0 0 3px rgba(253,174,84,0.2);
            background: rgba(255, 255, 255, 0.9);
        }

        .examples {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(253,174,84,0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .examples-title {
            font-size: 13px;
            font-weight: 700;
            color: #153036;
            margin-bottom: 10px;
        }

        .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-tag {
            background: rgba(253,174,84,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #153036;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .example-tag:hover {
            background: rgba(253,174,84,0.5);
            transform: translateY(-2px);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: #153036;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(253,174,84,0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(253,174,84,0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .name-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .name-chip {
            padding: 9px 16px;
            border: 2px solid rgba(253,174,84,0.5);
            border-radius: 20px;
            background: rgba(255,255,255,0.85);
            color: #153036;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .name-chip:active, .name-chip:hover {
            background: #FDAE54;
            border-color: #FDAE54;
            color: #fff;
            transform: scale(0.96);
        }

        .helper-text {
            font-size: 12px;
            color: #597176;
            text-align: center;
            margin-top: 10px;
            font-style: italic;
        }

        .flash {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .flash.success {
            background: rgba(76, 175, 80, 0.2);
            color: #2e7d32;
            border: 2px solid rgba(76, 175, 80, 0.4);
        }

        .flash.danger {
            background: rgba(244, 67, 54, 0.2);
            color: #c62828;
            border: 2px solid rgba(244, 67, 54, 0.4);
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            .page-header {
                padding: 15px;
            }

            .page-title {
                font-size: 20px;
            }

            input[type="text"] {
                padding: 14px;
                font-size: 15px;
            }

            .submit-btn {
                padding: 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- Header avec titre -->
<div class="page-header">
    <div class="page-icon">🏡</div>
    <h1 class="page-title">Nommer votre foyer</h1>
</div>

<div class="container">
    {% include '_flash_popup.html' %}

    <!-- Barre de progression -->
    <div class="progress-bar">
        <div class="progress-step"></div>
        <div class="progress-step"></div>
        <div class="progress-step"></div>
        <div class="progress-step active"></div>
        <div class="progress-step"></div>
    </div>

    <div class="subtitle">
        Donnez un nom à votre foyer pour le rendre plus personnel.
        Vous pourrez le changer plus tard ! 🎨
    </div>

    <form method="post">
        <div class="form-group">
            <label for="house_name">Nom du foyer</label>
            <input type="text" 
                   id="house_name" 
                   name="house_name" 
                   placeholder="Ex: La Villa des Champions"
                   maxlength="50"
                   required
                   autocomplete="off">
        </div>

        <div class="examples">
            <div class="examples-title">💡 Suggestions :</div>
            <div class="name-chips">
                <button type="button" class="name-chip" onclick="document.getElementById('house_name').value=this.textContent;document.getElementById('house_name').focus()">Notre Cocon</button>
                <button type="button" class="name-chip" onclick="document.getElementById('house_name').value=this.textContent;document.getElementById('house_name').focus()">Le QG</button>
                <button type="button" class="name-chip" onclick="document.getElementById('house_name').value=this.textContent;document.getElementById('house_name').focus()">Sweet Home</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            Suivant →
        </button>

        <p class="helper-text">
            Ce nom sera visible par tous les membres du foyer
        </p>
    </form>
</div>

<script>
    // Auto-focus sur le champ
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('house_name').focus();
    });
</script>

</body>
</html>
