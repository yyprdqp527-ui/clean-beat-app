<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Connexion - Clean Beat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 🚨 FIX ANTI-ZOOM iOS Safari - CRITIQUE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/anti-zoom-ios.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: {{ bg_gradient }};
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* 📱 MOBILE OPTIMISÉ */
        @media (max-width: 480px) {
            body {
                padding: 15px !important;
            }
            
            h1 {
                font-size: 26px !important;
                margin-bottom: 20px !important;
            }
            
            form {
                padding: 25px 20px !important;
                border-radius: 18px !important;
            }
            
            input[type="email"],
            input[type="password"] {
                padding: 12px !important;
                font-size: 14px !important;
            }
            
            button {
                padding: 14px !important;
                font-size: 15px !important;
            }
        }
        
        @media (max-width: 375px) {
            body {
                padding: 12px !important;
            }
            
            h1 {
                font-size: 22px !important;
            }
            
            form {
                padding: 20px 15px !important;
                gap: 15px !important;
            }
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        form {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(166,211,220,0.2) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 24px;
            border-radius: 28px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #597176;
        }

        button {
            padding: 15px;
            border: none;
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: white;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(253, 174, 84, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 174, 84, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Style des messages flash */
        .flash-msg {
            text-align: center;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .flash-success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .flash-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .flash-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            display: inline-block;
        }

        .register-link a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            h1 {
                font-size: 28px;
                margin-bottom: 20px;
            }

            form {
                padding: 30px 20px;
                max-width: 100%;
            }

            input[type="email"],
            input[type="password"] {
                padding: 12px;
                font-size: 14px;
            }

            button {
                padding: 12px;
                font-size: 15px;
            }
        }
        
        /* iPad et tablettes */
        @media (min-width: 768px) and (max-width: 1024px) {
            form {
                max-width: 500px;
                padding: 45px 35px;
            }
            
            h1 {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
{% include '_flash_popup.html' %}

<h1>🔐 Connexion</h1>

<form method="post" action="{{ url_for('login') }}" autocomplete="on">
    {% if request.args.get('next_code') %}
    <input type="hidden" name="next_code" value="{{ request.args.get('next_code') }}">
    {% endif %}
    <label>Email:</label>
    <input type="email" name="email" required
           autocomplete="username" inputmode="email">

    <label>Mot de passe:</label>
    <input type="password" id="loginPassword" name="password" required
           autocomplete="current-password">

    <button type="submit">Se connecter</button>
</form>

<div style="text-align:center;margin-top:10px;">
    <a href="{{ url_for('signup_email') }}"
       style="color:rgba(255,255,255,0.85);font-size:13px;text-decoration:underline;">
        Mot de passe oublié ?
    </a>
</div>

<div class="register-link">
    <p>Pas de compte ? <a href="{{ url_for('signup_email') }}">Créer un compte</a></p>
</div>

</body>
</html>
