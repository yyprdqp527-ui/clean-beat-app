<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>CleanBeat - Accueil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- CSS moderne harmonisé -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-style.css') }}">
    
    <style>
        /* ── Variables couleurs modernes ── */
        :root {
            --primary: #A6D3DC;
            --secondary: #C4E4E9;
            --accent: #FDAE54;
            --dark: #597176;
            --dark-text: #153036;
            --light: #F4F9FA;
            --white: #ffffff;
            --border-light: #e8f4f8;
            --shadow-medium: rgba(89,113,118,0.12);
            --shadow-strong: rgba(89,113,118,0.2);
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--dark-text);
        }

        .home-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .home-card {
            background: var(--white);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 8px 32px var(--shadow-medium);
            border: 1px solid var(--border-light);
            animation: fadeInUp 0.6s ease-out;
        }

        .logo-container {
            margin-bottom: 32px;
            animation: fadeInDown 0.8s ease-out 0.2s both;
        }

        .logo-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-shadow: 0 8px 24px var(--shadow-medium);
            border: 4px solid var(--primary);
            transition: transform 0.3s ease;
            object-fit: cover;
        }

        .logo-image:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px var(--shadow-strong);
        }

        .home-title {
            color: var(--dark);
            font-size: 42px;
            margin-bottom: 16px;
            font-weight: 800;
            letter-spacing: -0.5px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .home-subtitle {
            color: var(--dark);
            opacity: 0.8;
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 500;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .home-btn {
            padding: 16px 40px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 200px;
            font-family: inherit;
            box-shadow: 0 4px 16px var(--shadow-medium);
        }

        .home-btn-primary {
            background: linear-gradient(135deg, var(--accent), #F4C68D);
            color: var(--white);
            border: 2px solid var(--accent);
        }

        .home-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(253, 174, 84, 0.4);
        }

        .home-btn-secondary {
            background: var(--white);
            color: var(--dark-text);
            border: 2px solid var(--border-light);
        }

        .home-btn-secondary:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px var(--shadow-strong);
        }

        .home-btn:active {
            transform: scale(0.98);
        }

        /* ── Décorations de fond modernes ── */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }

        .bg-decoration:nth-child(1) {
            width: 120px;
            height: 120px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .bg-decoration:nth-child(2) {
            width: 180px;
            height: 180px;
            top: 70%;
            right: 5%;
            animation-delay: 3s;
        }

        .bg-decoration:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 85%;
            left: 15%;
            animation-delay: 6s;
        }

        .home-container {
            position: relative;
            z-index: 1;
        }

        /* ── Animations ── */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-20px) rotate(120deg);
            }
            66% {
                transform: translateY(-10px) rotate(240deg);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .home-card {
                padding: 32px 24px;
                margin: 16px;
            }
            
            .logo-image {
                width: 150px;
                height: 150px;
            }

            .home-title {
                font-size: 32px;
                margin-bottom: 12px;
            }

            .home-subtitle {
                font-size: 16px;
                margin-bottom: 32px;
            }

            .home-btn {
                padding: 14px 32px;
                font-size: 15px;
                min-width: 180px;
            }
        }
        
        @media (max-width: 480px) {
            .home-card {
                padding: 24px 20px;
                border-radius: 20px;
            }
            
            .logo-image {
                width: 120px;
                height: 120px;
            }

            .home-title {
                font-size: 28px;
            }

            .home-subtitle {
                font-size: 14px;
            }

            .buttons-container {
                gap: 12px;
            }

            .home-btn {
                padding: 12px 24px;
                font-size: 14px;
                min-width: 160px;
            }
        }

        @media (min-width: 768px) {
            .buttons-container {
                flex-direction: row;
                justify-content: center;
                gap: 24px;
            }
        }
    </style>
</head>
<body>

<!-- Décorations de fond -->
<div class="bg-decoration"></div>
<div class="bg-decoration"></div>
<div class="bg-decoration"></div>

<div class="home-container">
    <div class="home-card">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/Ménage à Deux.png') }}" 
                 alt="CleanBeat" 
                 class="logo-image">
        </div>
        
        <h1 class="home-title">CleanBeat</h1>
        
        <p class="home-subtitle">
            Transformez les tâches ménagères en jeu amusant !<br>
            Gérez votre maison en équipe et gagnez des points.
        </p>
        
        <div class="buttons-container">
            <a href="{{ url_for('signup') }}" class="home-btn home-btn-primary">
                📝 S'inscrire
            </a>
            <a href="{{ url_for('menu') }}" class="home-btn home-btn-secondary">
                🏠 Se connecter
            </a>
        </div>
    </div>
</div>

</body>
</html>
