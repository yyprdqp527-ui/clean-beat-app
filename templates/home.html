<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Ménage à Deux - Accueil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #A6D3DC 0%, #597176 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            z-index: 2;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease;
        }

        .logo-image:hover {
            transform: scale(1.05);
        }

        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-weight: 700;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 18px;
            margin-bottom: 50px;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .btn {
            padding: 18px 50px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            min-width: 220px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(253, 174, 84, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(253, 174, 84, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Effets de fond animés */
        .bg-decoration {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .bg-decoration:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .bg-decoration:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .bg-decoration:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Responsive - Petits téléphones */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                padding: 15px;
            }

            .logo-image {
                width: 180px;
                height: 180px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 10px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 35px;
            }

            .btn {
                padding: 15px 40px;
                font-size: 15px;
                min-width: 180px;
            }

            .buttons-container {
                gap: 15px;
            }
        }
        
        /* Téléphones moyens et grands */
        @media (min-width: 481px) and (max-width: 768px) {
            .container {
                max-width: 400px;
            }

            .logo-image {
                width: 220px;
                height: 220px;
            }

            h1 {
                font-size: 40px;
            }

            .btn {
                min-width: 200px;
            }

            .buttons-container {
                gap: 18px;
            }
        }
        
        /* iPad et tablettes */
        @media (min-width: 768px) and (max-width: 1024px) {
            .container {
                max-width: 550px;
            }

            .logo-image {
                width: 280px;
                height: 280px;
            }

            h1 {
                font-size: 52px;
            }

            .subtitle {
                font-size: 20px;
            }

            .btn {
                min-width: 240px;
                font-size: 19px;
                padding: 20px 55px;
            }

            .buttons-container {
                gap: 25px;
            }
        }

        @media (min-width: 768px) {
            .buttons-container {
                flex-direction: row;
                justify-content: center;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

<!-- Décorations de fond -->
<div class="bg-decoration"></div>
<div class="bg-decoration"></div>
<div class="bg-decoration"></div>

<div class="container">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='images/Ménage à Deux.png') }}" 
             alt="Ménage à Deux" 
             class="logo-image">
    </div>
    
    <h1>Ménage à Deux</h1>
    
    <p class="subtitle">
        Transformez les tâches ménagères en jeu amusant !<br>
        Gérez votre maison en équipe et gagnez des récompenses.
    </p>
    
    <div class="buttons-container">
        <a href="{{ url_for('signup') }}" class="btn btn-primary">
            S'inscrire
        </a>
        <a href="{{ url_for('menu') }}" class="btn btn-secondary">
            Se connecter
        </a>
    </div>
</div>

</body>
</html>
