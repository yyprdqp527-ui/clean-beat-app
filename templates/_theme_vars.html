{# ══════════════════════════════════════════════════════════════
   🎨 TOKENS DE THÈME ADAPTATIFS — Lisibilité texte / fond
   Incluez ce fichier dans <head> pour que le texte s'adapte
   automatiquement au fond choisi (clair ou sombre).
   ══════════════════════════════════════════════════════════════ #}
<style id="theme-adaptive-vars">
:root {
    --adaptive-text: {% if bg_theme_light %}#153036{% else %}#ffffff{% endif %};
    --adaptive-muted: {% if bg_theme_light %}rgba(21,48,54,0.7){% else %}rgba(255,255,255,0.7){% endif %};
    --adaptive-light: {% if bg_theme_light %}rgba(21,48,54,0.5){% else %}rgba(255,255,255,0.5){% endif %};
    --adaptive-border: {% if bg_theme_light %}rgba(21,48,54,0.12){% else %}rgba(255,255,255,0.15){% endif %};
    --adaptive-glass: {% if bg_theme_light %}rgba(21,48,54,0.06){% else %}rgba(255,255,255,0.08){% endif %};
    --adaptive-shadow: {% if bg_theme_light %}none{% else %}0 2px 4px rgba(0,0,0,0.6){% endif %};
    --header-bg: {% if bg_theme_light %}rgba(255,255,255,0.92){% else %}rgba(21,48,54,0.78){% endif %};
    --header-border: {% if bg_theme_light %}#e8f4f8{% else %}rgba(255,255,255,0.12){% endif %};
    --header-shadow: {% if bg_theme_light %}0 4px 16px rgba(89,113,118,0.12){% else %}0 4px 16px rgba(0,0,0,0.35){% endif %};
}
</style>
