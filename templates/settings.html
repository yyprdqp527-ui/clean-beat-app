{% extends "base.html" %}
{% set hide_header = true %}
{% block title %}Réglages · CleanBeat{% endblock %}

{% block content %}
<style>
    /* ===== CONTENEUR ===== */
    .settings-container {
        max-width: 560px;
        margin: 0 auto;
        padding: 40px 20px 60px 20px;
    }

    /* ===== EN-TÊTE ===== */
    .settings-header {
        background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(130,100,220,0.15) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 24px 20px;
        margin-bottom: 24px;
        text-align: center;
        border: 2px solid rgba(130,100,220,0.25);
        box-shadow: 0 8px 32px rgba(89,113,118,0.15);
    }
    .settings-header .header-icon { font-size: 48px; display: block; margin-bottom: 8px; }
    .settings-header h1 {
        font-size: 22px; font-weight: 800; color: #153036; margin: 0 0 4px;
    }
    .settings-header .subtitle {
        font-size: 14px; color: #597176; font-weight: 500;
    }

    /* ══ Grille de boutons settings — style gameplay ══ */
    .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    .settings-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        aspect-ratio: 1;
        background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(166,211,220,0.18) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 2px solid rgba(255,255,255,0.55);
        border-radius: 22px;
        padding: 14px 8px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
        box-shadow: 0 8px 28px rgba(89,113,118,0.14), inset 0 1px 0 rgba(255,255,255,0.7);
        -webkit-tap-highlight-color: transparent;
        text-decoration: none;
        position: relative;
        overflow: hidden;
    }
    .settings-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 20px;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%);
        opacity: 0.7;
        transition: opacity 0.3s;
        pointer-events: none;
    }
    .settings-btn:hover {
        transform: translateY(-4px) scale(1.03);
        box-shadow: 0 14px 40px rgba(89,113,118,0.22), inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .settings-btn:active {
        transform: translateY(0) scale(0.97);
        box-shadow: 0 4px 16px rgba(89,113,118,0.12);
    }
    .settings-btn .sg-icon {
        font-size: 38px;
        filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25));
        line-height: 1;
        transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .settings-btn:hover .sg-icon {
        transform: scale(1.15) rotate(-3deg);
    }
    .settings-btn .sg-label {
        font-size: 13px;
        font-weight: 900;
        color: #153036;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        text-align: center;
        line-height: 1.25;
    }
    /* Accent couleurs par bouton */
    .settings-btn.sg-theme {
        border-color: rgba(166,211,220,0.35);
        background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(166,211,220,0.18) 100%);
    }
    .settings-btn.sg-theme .sg-label { color: #2E6E78; }
    .settings-btn.sg-house {
        border-color: rgba(253,174,84,0.3);
        background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(253,174,84,0.12) 100%);
    }
    .settings-btn.sg-house .sg-label { color: #96621C; }
    .settings-btn.sg-add {
        border-color: rgba(46,180,120,0.25);
        background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(46,180,120,0.12) 100%);
    }
    .settings-btn.sg-add .sg-label { color: #1B6B4A; }
    .settings-btn.sg-edit {
        border-color: rgba(130,100,220,0.25);
        background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(130,100,220,0.12) 100%);
    }
    .settings-btn.sg-edit .sg-label { color: #5A3D94; }

    @media (max-width: 520px) {
        .settings-container { padding-top: 90px; }
    }
    @media (max-width: 480px) {
        .settings-grid { gap: 12px; }
        .settings-btn { border-radius: 18px; padding: 12px 6px; }
        .settings-btn .sg-icon { font-size: 32px; }
        .settings-btn .sg-label { font-size: 12px; }
    }
    @media (max-width: 360px) {
        .settings-grid { gap: 10px; }
        .settings-btn .sg-icon { font-size: 28px; }
        .settings-btn .sg-label { font-size: 11px; }
    }
</style>

<a href="{{ url_for('menu') }}" class="back-btn-glass" aria-label="Retour au menu">←</a>

<div class="settings-container">

    <!-- EN-TÊTE -->
    <div class="settings-header">
        <span class="header-icon">⚙️</span>
        <h1>Réglages</h1>
        <p class="subtitle">Gère ta maison et tes joueurs</p>
    </div>

    <!-- GRILLE DE BOUTONS -->
    <div class="settings-grid">
        <!-- 1. Changer le thème / couleur du fond -->
        <a href="{{ url_for('customize.settings_theme') }}" class="settings-btn sg-theme">
            <span class="sg-icon">🎨</span>
            <span class="sg-label">Thème &amp; couleur</span>
        </a>

        <!-- 2. Personnaliser la maison (chambres, pièces) -->
        <a href="{{ url_for('customize.personnaliser_maison') }}" class="settings-btn sg-house">
            <span class="sg-icon">🏡</span>
            <span class="sg-label">Personnaliser maison</span>
        </a>

        <!-- 3. Ajouter des joueurs -->
        <a href="{{ url_for('players.add_players') }}" class="settings-btn sg-add">
            <span class="sg-icon">➕</span>
            <span class="sg-label">Ajouter joueurs</span>
        </a>

        <!-- 4. Modifier les profils -->
        <a href="{{ url_for('players.manage_players') }}" class="settings-btn sg-edit">
            <span class="sg-icon">👥</span>
            <span class="sg-label">Modifier profils</span>
        </a>
    </div>
</div>

<!-- ═══ BULLES BD D'AIDE SETTINGS ═══ -->
<style>
.qfq-page-tip {
  position: fixed;
  z-index: 9000;
  max-width: 270px;
  background: linear-gradient(135deg, rgba(255,255,255,0.97) 0%, rgba(253,174,84,0.12) 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 3px solid rgba(253,174,84,0.45);
  border-radius: 22px 20px 24px 18px;
  box-shadow: 0 8px 32px rgba(89,113,118,0.22), inset 0 1px 0 rgba(255,255,255,0.6);
  padding: 14px 16px 12px;
  animation: pageTipIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: pointer;
}
.qfq-page-tip-text { font-size: 13px; font-weight: 600; color: #153036; line-height: 1.5; }
.qfq-page-tip-close {
  position: absolute; top: 6px; right: 10px;
  font-size: 18px; color: #FDAE54; font-weight: 800;
  background: none; border: none; cursor: pointer; line-height: 1;
}
.qfq-page-tip.pos-top::before {
  content: ''; position: absolute; bottom: -16px; left: var(--arrow-x, 50%); transform: translateX(-50%);
  border-left: 15px solid transparent; border-right: 15px solid transparent;
  border-top: 16px solid rgba(255,71,87,0.25);
}
.qfq-page-tip.pos-top::after {
  content: ''; position: absolute; bottom: -11px; left: var(--arrow-x, 50%); transform: translateX(-50%);
  border-left: 11px solid transparent; border-right: 11px solid transparent;
  border-top: 12px solid #ff4757;
}
@keyframes pageTipIn {
  0%   { opacity: 0; transform: translateY(8px) scale(0.9); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pageTipOut {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: translateY(-6px) scale(0.9); }
}
</style>
<script>
(function(){
  var tips = [
    {
      key: 'qfq_tips_settings',
      target: '.sg-edit',
      text: "Change les avatars de tes joueurs ici ! N'oublie pas d'enregistrer 💾",
      pos: 'top'
    },
    {
      key: 'qfq_tips_settings',
      target: '.sg-house',
      text: "Personnalise ta maison : ajoute ou supprime des pièces ! N'oublie pas d'enregistrer 🏡",
      pos: 'top'
    }
  ];
  // Filter out already-seen tips
  tips = tips.filter(function(t){ return !localStorage.getItem(t.key); });
  if (!tips.length) return;
  var idx = 0;
  function showTip() {
    if (idx >= tips.length) return;
    var t = tips[idx];
    var el = document.querySelector(t.target);
    if (!el) { idx++; showTip(); return; }
    var rect = el.getBoundingClientRect();
    var targetCX = rect.left + rect.width / 2;
    var tip = document.createElement('div');
    tip.className = 'qfq-page-tip pos-top';
    tip.innerHTML = '<div class="qfq-page-tip-text">' + t.text + '</div>'
      + '<button class="qfq-page-tip-close">\u2715</button>';
    tip.style.visibility = 'hidden';
    document.body.appendChild(tip);
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.max(8, Math.min(window.innerWidth - tw - 8, targetCX - tw / 2));
    var arrowX = Math.max(14, Math.min(tw - 24, targetCX - left - 11));
    tip.style.setProperty('--arrow-x', arrowX + 'px');
    tip.style.left = left + 'px';
    tip.style.top = (rect.top - th - 16) + 'px';
    tip.style.visibility = '';
    function dismiss(e) {
      if (e) e.stopPropagation();
      tip.style.animation = 'pageTipOut 0.25s ease forwards';
      setTimeout(function(){ tip.remove(); }, 250);
      localStorage.setItem(t.key, '1');
      idx++;
      setTimeout(showTip, 400);
    }
    tip.querySelector('.qfq-page-tip-close').addEventListener('click', dismiss);
    tip.addEventListener('click', dismiss);
  }
  setTimeout(showTip, 800);
})();
</script>
{% endblock %}
