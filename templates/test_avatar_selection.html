<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sélection Avatar - CleanBeat</title>
    <style>
        :root {
            --teal-light: #4ECDC4;
            --teal-dark: #2C9A8F;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .photo-preview {
            width: 130px;
            height: 130px;
            border-radius: 24px;
            border: 4px solid var(--teal-light);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            overflow: hidden;
            cursor: pointer;
            font-size: 50px;
            color: var(--teal-dark);
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        
        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .dicebear-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .dicebear-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            background: #f5f5f5;
        }
        
        .dicebear-item:hover {
            border-color: var(--teal-light);
            transform: scale(1.05);
        }
        
        .dicebear-item.selected {
            border-color: var(--teal-dark);
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.3);
        }
        
        .dicebear-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .style-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .style-btn {
            padding: 10px 20px;
            border: 2px solid var(--teal-light);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #333;
        }
        
        .style-btn:hover {
            background: var(--teal-light);
            color: white;
        }
        
        .style-btn.active {
            background: var(--teal-dark);
            border-color: var(--teal-dark);
            color: white;
        }
        
        .info-box {
            background: #e7f5ff;
            border-left: 4px solid #1971c2;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }
        
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .debug-info h3 {
            margin-top: 0;
            font-size: 14px;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test de Sélection d'Avatar</h1>
        
        <div class="info-box">
            <strong>🎯 Objectif :</strong> Vérifier que la sélection d'avatar DiceBear fonctionne et que l'aperçu s'affiche correctement.
        </div>
        
        <h3 style="text-align: center; color: #666;">Aperçu de l'avatar</h3>
        <div class="photo-preview" id="photoPreview">
            👤
        </div>
        
        <h3 style="color: #666;">Choisir un style</h3>
        <div class="style-buttons">
            <button class="style-btn active" onclick="selectDiceBearStyle('adventurer', this)">Adventurer</button>
            <button class="style-btn" onclick="selectDiceBearStyle('avataaars', this)">Avataaars</button>
            <button class="style-btn" onclick="selectDiceBearStyle('lorelei', this)">Lorelei</button>
            <button class="style-btn" onclick="selectDiceBearStyle('micah', this)">Micah</button>
            <button class="style-btn" onclick="selectDiceBearStyle('personas', this)">Personas</button>
        </div>
        
        <h3 style="color: #666;">Galerie d'avatars</h3>
        <div class="dicebear-grid" id="dicebear-grid"></div>
        
        <div class="debug-info">
            <h3>🔍 Informations de débogage</h3>
            <div id="debug-output">
                <p>Style actuel: <span id="debug-style">adventurer</span></p>
                <p>Avatar sélectionné: <span id="debug-avatar">Aucun</span></p>
                <p>URL: <span id="debug-url">Aucune</span></p>
            </div>
        </div>
    </div>
    
    <script>
        let currentDiceBearStyle = 'adventurer';
        let currentDiceBearSeeds = [];
        const DICEBEAR_COUNT = 8;
        
        function generateRandomSeeds(count) {
            const seeds = [];
            for (let i = 0; i < count; i++) {
                seeds.push(Math.random().toString(36).substring(2, 10));
            }
            return seeds;
        }
        
        function selectDiceBearStyle(style, btn) {
            currentDiceBearStyle = style;
            
            // Update style buttons
            document.querySelectorAll('.style-btn').forEach(b => {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            
            // Update debug
            document.getElementById('debug-style').textContent = style;
            
            // Generate new avatars for this style
            currentDiceBearSeeds = generateRandomSeeds(DICEBEAR_COUNT);
            renderDiceBearGrid();
            
            console.log(`✅ Style changé: ${style}`);
        }
        
        function renderDiceBearGrid() {
            const grid = document.getElementById('dicebear-grid');
            grid.innerHTML = '';
            
            currentDiceBearSeeds.forEach((seed, index) => {
                const url = `https://api.dicebear.com/7.x/${currentDiceBearStyle}/svg?seed=${seed}`;
                
                const div = document.createElement('div');
                div.className = 'dicebear-item';
                div.innerHTML = `<img src="${url}" alt="Avatar ${index + 1}" loading="lazy">`;
                div.onclick = () => selectDiceBearAvatar(url, seed, div);
                grid.appendChild(div);
            });
            
            console.log(`✅ ${currentDiceBearSeeds.length} avatars générés`);
        }
        
        function selectDiceBearAvatar(url, seed, element) {
            // Deselect all avatars
            document.querySelectorAll('.dicebear-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // Select this one
            element.classList.add('selected');
            
            // Update preview
            const preview = document.getElementById('photoPreview');
            preview.innerHTML = `<img src="${url}" alt="Avatar" id="preview-img">`;
            
            // Update debug info
            document.getElementById('debug-avatar').textContent = seed;
            document.getElementById('debug-url').textContent = url;
            
            console.log(`✅ Avatar DiceBear sélectionné: ${currentDiceBearStyle}/${seed}`);
            console.log(`   URL: ${url}`);
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Page chargée, génération des avatars...');
            currentDiceBearSeeds = generateRandomSeeds(DICEBEAR_COUNT);
            renderDiceBearGrid();
        });
    </script>
</body>
</html>
