<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Inscription - Clean Beat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 🚨 FIX ANTI-ZOOM iOS Safari - CRITIQUE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/anti-zoom-ios.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: {{ bg_gradient }};
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        form {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #597176;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .radio-group input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .house-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            border: none;
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: white;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(253, 174, 84, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 174, 84, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            display: inline-block;
        }

        .login-link a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Style des messages flash */
        .flash {
            margin-bottom: 20px;
            max-width: 400px;
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
        }

        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .flash.danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
                margin-bottom: 20px;
            }

            form {
                padding: 30px 20px;
            }

            input[type="email"],
            input[type="password"],
            input[type="text"] {
                padding: 12px;
                font-size: 14px;
            }

            button {
                padding: 12px;
                font-size: 15px;
            }

            .radio-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<h1>✨ Inscription</h1>

{% include '_flash_popup.html' %}

<form method="post">
    <div class="house-section">
        <label>Email :</label>
        <input type="email" name="email" required>
    </div>

    <div class="house-section">
        <label>Mot de passe :</label>
        <input type="password" name="password" required>
    </div>

    <div class="house-section">
        <div class="radio-group">
            <label><input type="radio" name="house_option" value="create" {% if not house_code_param %}checked{% endif %}> Créer une maison</label>
            <label><input type="radio" name="house_option" value="join" {% if house_code_param %}checked{% endif %}> Rejoindre une maison</label>
        </div>
    </div>

    <div id="create_house" class="house-section" {% if house_code_param %}style="display:none;"{% endif %}>
        <label>Nom de la maison :</label>
        <input type="text" name="house_name">
        
        <label style="margin-top: 15px;">Type de foyer :</label>
        <div class="radio-group" style="flex-direction: column; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="house_type" value="family" checked> 
                <span>Famille (Parents/Enfants)</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="house_type" value="couple"> 
                <span>Couple</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="house_type" value="coloc"> 
                <span>Colocation</span>
            </label>
        </div>
    </div>

    <div id="join_house" class="house-section" {% if not house_code_param %}style="display:none;"{% else %}style="display:flex;"{% endif %}>
        <label>Code de la maison :</label>
        <input type="text" name="house_code" value="{{ house_code_param }}">
    </div>

    <div class="house-section">
        <label>Choisir un avatar :</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="avatar" value="default.png" checked> 👤 Avatar
            </label>
            <label>
                <input type="radio" name="avatar" value="femme.png"> 👩 Femme
            </label>
        </div>
    </div>

    <button type="submit">S'inscrire</button>
</form>

<div class="login-link">
    <p>Déjà un compte ? <a href="{{ url_for('login') }}">Connexion</a></p>
</div>

<script>
// Afficher ou masquer les champs selon l'option
document.querySelectorAll('input[name="house_option"]').forEach(el => {
    el.addEventListener('change', function() {
        if (this.value === 'create') {
            document.getElementById('create_house').style.display = 'flex';
            document.getElementById('join_house').style.display = 'none';
        } else {
            document.getElementById('create_house').style.display = 'none';
            document.getElementById('join_house').style.display = 'flex';
        }
    });
});
</script>

</body>
</html>
