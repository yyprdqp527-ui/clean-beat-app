<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CleanBeat - Bienvenue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #A6D3DC 0%, #597176 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("{{ url_for('static', filename='images/Ménage à Deux.png') }}");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        
        /* Optimisation pour les écrans très larges */
        @media (min-width: 1400px) {
            .background-image {
                background-size: contain;
                background-position: center;
            }
        }
        
        /* Optimisation pour les écrans mobiles */
        @media (max-width: 768px) {
            .background-image {
                background-size: contain;
                background-position: center center;
            }
        }
        
        /* Optimisation pour les très petits écrans */
        @media (max-width: 480px) {
            .background-image {
                background-size: 90% auto;
                background-position: center center;
            }
        }
        
        @media (max-width: 375px) {
            .background-image {
                background-size: 85% auto;
            }
        }
        
        /* Optimisation pour les écrans en mode paysage mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .background-image {
                background-size: contain;
                background-position: center;
            }
        }

        /* Overlay simple pour lisibilité du bouton uniquement */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, transparent 70%, rgba(89, 113, 118, 0.2) 100%);
            z-index: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Support des nouveaux viewports dynamiques */
            padding: 50px 20px;
            text-align: center;
            color: white;
            position: relative;
            z-index: 1; /* au-dessus de l'overlay */
            max-width: 100vw;
            overflow: hidden;
        }

        /* Safe area pour iPhone (notch) */
        @supports(padding: env(safe-area-inset-bottom)) {
            .container { padding-bottom: calc(50px + env(safe-area-inset-bottom)); }
        }

        .cta-button {
            background: linear-gradient(45deg, #000, #333, #000);
            background-size: 300% 300%;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: gradientShift 3s ease infinite;
            backdrop-filter: saturate(120%) blur(2px);
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            background: linear-gradient(45deg, #333, #666, #333);
        }

        .cta-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        @media (max-width: 768px) {
            .cta-button {
                padding: 16px 34px;
                font-size: 1.15em;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }
            
            .container {
                padding: 30px 20px;
                min-height: 100vh;
                min-height: 100dvh; /* Support pour les nouveaux viewports dynamiques */
            }

            /* Overlay minimal sur mobile */
            .overlay { 
                background: linear-gradient(180deg, transparent 0%, transparent 75%, rgba(89, 113, 118, 0.15) 100%); 
            }
        }
        
        /* Optimisations pour les très petits écrans */
        @media (max-width: 480px) {
            .cta-button {
                padding: 14px 28px;
                font-size: 1em;
                letter-spacing: 1px;
            }
            
            .container {
                padding: 20px 15px;
            }
        }
        
        /* Optimisations pour les écrans en mode paysage */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                padding: 20px;
                justify-content: center;
            }
            
            .cta-button {
                padding: 12px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <a href="/signup_email" class="cta-button">
            Que le meilleur gagne !
        </a>
    </div>
</body>
</html>
