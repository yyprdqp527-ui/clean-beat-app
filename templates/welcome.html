<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dust - Bienvenue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #4a3428 0%, #1a1410 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("{{ url_for('static', filename='images/Ménage à Deux.png') }}");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        
        /* Optimisation pour les écrans très larges */
        @media (min-width: 1400px) {
            .background-image {
                background-size: contain;
                background-position: center;
            }
        }
        
        /* Optimisation pour les écrans mobiles */
        @media (max-width: 768px) {
            .background-image {
                background-size: contain;
                background-position: center center;
            }
        }
        
        /* Optimisation pour les très petits écrans */
        @media (max-width: 480px) {
            .background-image {
                background-size: 90% auto;
                background-position: center center;
            }
        }
        
        @media (max-width: 375px) {
            .background-image {
                background-size: 85% auto;
            }
        }
        
        /* Optimisation pour les écrans en mode paysage mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .background-image {
                background-size: contain;
                background-position: center;
            }
        }

        /* Overlay simple pour lisibilité du bouton uniquement */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, transparent 70%, rgba(89, 113, 118, 0.2) 100%);
            z-index: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Support des nouveaux viewports dynamiques */
            padding: 50px 20px;
            text-align: center;
            color: white;
            position: relative;
            z-index: 1; /* au-dessus de l'overlay */
            max-width: 100vw;
            overflow: hidden;
        }

        /* Safe area pour iPhone (notch) */
        @supports(padding: env(safe-area-inset-bottom)) {
            .container { padding-bottom: calc(50px + env(safe-area-inset-bottom)); }
        }

        .cta-button {
            background: linear-gradient(45deg, #000, #333, #000);
            background-size: 300% 300%;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: gradientShift 3s ease infinite;
            backdrop-filter: saturate(120%) blur(2px);
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            background: linear-gradient(45deg, #333, #666, #333);
        }

        .cta-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        @media (max-width: 768px) {
            .cta-button {
                padding: 16px 34px;
                font-size: 1.15em;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }
            
            .container {
                padding: 30px 20px;
                min-height: 100vh;
                min-height: 100dvh; /* Support pour les nouveaux viewports dynamiques */
            }

            /* Overlay minimal sur mobile */
            .overlay { 
                background: linear-gradient(180deg, transparent 0%, transparent 75%, rgba(89, 113, 118, 0.15) 100%); 
            }
        }
        
        /* Optimisations pour les très petits écrans */
        @media (max-width: 480px) {
            .cta-button {
                padding: 14px 28px;
                font-size: 1em;
                letter-spacing: 1px;
            }
            
            .container {
                padding: 20px 15px;
            }
        }
        
        /* Optimisations pour les écrans en mode paysage */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                padding: 20px;
                justify-content: center;
            }
            
            .cta-button {
                padding: 12px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>

    <!-- ⏳ Splash de démarrage (visible uniquement lors d'un cold start Render) -->
    <div id="splash-loading" style="display:none; position:fixed; inset:0; z-index:9999;
         background:linear-gradient(135deg,#4a3428 0%,#1a1410 100%);
         flex-direction:column; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="font-size:3em; margin-bottom:20px; animation:pulse 1.4s infinite;">🏠</div>
        <div style="color:#fff; font-size:1.1em; font-weight:600; margin-bottom:8px;">
            L'appli se réveille…
        </div>
        <div style="color:rgba(255,255,255,0.75); font-size:0.85em; text-align:center; max-width:260px; line-height:1.5; margin-bottom:24px;">
            Premier chargement du jour, encore<br>quelques secondes ☕
        </div>
        <div style="width:200px; height:4px; background:rgba(255,255,255,0.25); border-radius:4px; overflow:hidden;">
            <div id="splash-bar" style="height:100%; width:0%; background:white; border-radius:4px;
                 transition:width 0.3s ease;"></div>
        </div>
        <div id="splash-timer" style="color:rgba(255,255,255,0.6); font-size:0.78em; margin-top:10px;">0s</div>
    </div>

    <div class="background-image"></div>
    <div class="overlay"></div>
    
    <div class="container" id="main-content" style="opacity:0; transition:opacity 0.5s ease;">
        <div class="tagline">
            <p class="description">
                Transformez les tâches ménagères en compétition fun !<br>
                Gagnez des points, défiez vos colocataires, et vivez mieux ensemble.
            </p>
        </div>
        <a href="/signup_email" class="cta-button">
            Que le meilleur gagne !
        </a>
    </div>

    <style>
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    </style>

    <script>
    (function() {
        var start = Date.now();
        var splash = document.getElementById('splash-loading');
        var bar = document.getElementById('splash-bar');
        var timer = document.getElementById('splash-timer');
        var content = document.getElementById('main-content');
        var MAX_WAIT = 45000; // 45 secondes max

        // Détecter si la page met du temps à charger (cold start)
        function checkReady() {
            var elapsed = Date.now() - start;
            // Si la page charge en moins de 2s → pas de splash
            if (elapsed < 2000) {
                content.style.opacity = '1';
                return;
            }
            // Afficher le splash
            splash.style.display = 'flex';
            var interval = setInterval(function() {
                var t = Date.now() - start;
                var pct = Math.min((t / MAX_WAIT) * 100, 95);
                bar.style.width = pct + '%';
                timer.textContent = Math.round(t / 1000) + 's';
                // Ping le serveur pour savoir s'il répond
                fetch('/ping', { cache: 'no-store' })
                    .then(function(r) {
                        if (r.ok) {
                            clearInterval(interval);
                            bar.style.width = '100%';
                            setTimeout(function() {
                                splash.style.opacity = '0';
                                splash.style.transition = 'opacity 0.4s';
                                content.style.opacity = '1';
                                setTimeout(function() { splash.style.display = 'none'; }, 400);
                            }, 300);
                        }
                    }).catch(function() {});
            }, 1000);
        }

        // Lancer la vérification après un court délai
        if (document.readyState === 'complete') {
            checkReady();
        } else {
            window.addEventListener('load', checkReady);
        }
    })();
    </script>

    <style>
        .tagline {
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out;
        }

        .app-title {
            font-size: 4em;
            font-weight: 900;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            letter-spacing: 8px;
        }

        .subtitle {
            font-size: 1.2em;
            color: rgba(255,255,255,0.95);
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .description {
            font-size: 1em;
            color: rgba(255,255,255,0.85);
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .app-title {
                font-size: 3em;
                letter-spacing: 6px;
            }
            .subtitle {
                font-size: 1.1em;
            }
            .description {
                font-size: 0.95em;
            }
        }

        @media (max-width: 480px) {
            .app-title {
                font-size: 2.5em;
                letter-spacing: 4px;
            }
            .subtitle {
                font-size: 1em;
            }
            .description {
                font-size: 0.9em;
                padding: 0 10px;
            }
        }
    </style>
</body>
</html>
