<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Nouveau mot de passe - QuiFaitQuoi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 🚨 FIX ANTI-ZOOM iOS Safari - CRITIQUE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/anti-zoom-ios.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: {{ bg_gradient }};
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 28px;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(166,211,220,0.2) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 28px;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
            border: 2px solid rgba(255,255,255,0.5);
            max-width: 420px;
            width: 100%;
        }

        .subtitle {
            color: #597176;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .subtitle strong { color: #153036; }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 8px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border-radius: 14px;
            border: 2px solid #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #597176;
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #597176;
            padding: 0;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            background: linear-gradient(135deg, #FDAE54 0%, #F4C68D 100%);
            color: white;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(253,174,84,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253,174,84,0.6);
        }

@media (max-width: 480px) {
            .card { padding: 24px 18px; }
            h1 { font-size: 22px; }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/back-btn-glass.css') }}">
</head>
<body>
{% include '_flash_popup.html' %}

<h1>Nouveau mot de passe</h1>

<div class="card">
    {% if email %}
        <p class="subtitle">Compte : <strong>{{ email }}</strong><br>Choisis un nouveau mot de passe.</p>
    {% endif %}

    <form method="post" id="resetForm">
        <label for="password">Nouveau mot de passe</label>
        <div class="input-wrap">
            <input type="password" id="password" name="password" required
                   placeholder="Au moins 8 caractères"
                   autocomplete="new-password"
                   autofocus>
            <button type="button" class="toggle-btn" id="togglePwd" title="Afficher/masquer">👁</button>
        </div>
        <p class="hint">8 caractères minimum</p>
        <button type="submit" class="btn-submit">✅ Enregistrer le nouveau mot de passe</button>
    </form>

    <script>
        const pwdInput  = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePwd');

        toggleBtn.addEventListener('click', () => {
            const show = pwdInput.type === 'password';
            pwdInput.type = show ? 'text' : 'password';
            toggleBtn.textContent = show ? '🙈' : '👁';
        });

        document.getElementById('resetForm').addEventListener('submit', (e) => {
            if (pwdInput.value.length < 8) {
                e.preventDefault();
                pwdInput.style.borderColor = '#e55353';
                pwdInput.focus();
            } else {
                // Remettre en type=password pour que le trousseau l'enregistre
                pwdInput.type = 'password';
            }
        });
    </script>
</div>

<a href="{{ url_for('auth.login') }}" class="back-btn-glass" aria-label="Retour à la connexion">←</a>
</body>
</html>
