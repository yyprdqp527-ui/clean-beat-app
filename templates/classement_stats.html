{% extends "base.html" %}

{% block page_styles %}
<style>
    body {
        background: linear-gradient(135deg,
            rgba(255,255,255,0.92) 0%,
            rgba(253,174,84,0.15) 100%) !important;
    }
    .cs-page {
        min-height: calc(100vh - 200px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        gap: 32px;
    }
    .cs-title {
        font-family: 'Montserrat', sans-serif;
        font-size: 26px;
        font-weight: 800;
        color: #153036;
        text-align: center;
        margin: 0;
        letter-spacing: 0.3px;
    }
    .cs-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
    }

    /* ── Bouton style "gameplay-btn" (copié depuis menu.html) ── */
    @keyframes halo-gameplay {
        0%, 100% {
            box-shadow:
                0 6px 22px rgba(253,174,84,0.28),
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 0 0 0 rgba(253,174,84,0.0);
        }
        50% {
            box-shadow:
                0 8px 28px rgba(253,174,84,0.42),
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 0 16px 2px rgba(253,174,84,0.35);
        }
    }
    .gameplay-btn {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(253,174,84,0.18));
        backdrop-filter: saturate(200%) blur(30px);
        -webkit-backdrop-filter: saturate(200%) blur(30px);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FDAE54;
        font-size: 26px;
        cursor: pointer;
        text-decoration: none;
        box-shadow:
            0 6px 22px rgba(253,174,84,0.28),
            inset 0 1px 0 rgba(255,255,255,0.6);
        border: 1px solid rgba(253,174,84,0.32);
        transition: transform 0.2s ease, box-shadow 0.4s ease, background 0.4s ease;
        animation: halo-gameplay 3s ease-in-out infinite;
        position: relative;
        overflow: hidden;
    }
    .gameplay-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 50%;
        background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 100%);
        border-radius: 16px 16px 0 0;
        pointer-events: none;
    }
    .gameplay-btn:hover {
        animation: none;
        transform: scale(1.05);
        background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(253,174,84,0.28));
        box-shadow:
            0 10px 28px rgba(253,174,84,0.42),
            inset 0 1px 0 rgba(255,255,255,0.7),
            0 0 22px rgba(253,174,84,0.5);
    }
    .gameplay-btn:active {
        transform: scale(0.95);
    }
</style>
{% endblock %}

{% block content %}
<div class="cs-page">
    <h1 class="cs-title">Classement &amp; Stats</h1>
    <div class="cs-buttons">
        <a href="/classement" class="gameplay-btn"
           style="width:100%;max-width:320px;height:60px;border-radius:16px;font-size:16px;font-weight:700;color:#153036;text-decoration:none;display:flex;align-items:center;justify-content:center;">
            Classement
        </a>
        <a href="/sats" class="gameplay-btn"
           style="width:100%;max-width:320px;height:60px;border-radius:16px;font-size:16px;font-weight:700;color:#153036;text-decoration:none;display:flex;align-items:center;justify-content:center;">
            Stats
        </a>
    </div>
</div>
{% endblock %}
