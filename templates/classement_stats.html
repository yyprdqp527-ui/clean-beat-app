{% extends "base.html" %}
{% set hide_header = true %}

{% block page_styles %}
<style>
@keyframes halo-gameplay {
  0%, 100% {
    box-shadow: 0 6px 22px rgba(253,174,84,0.28),
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 0 0 0 rgba(253,174,84,0.0);
  }
  50% {
    box-shadow: 0 8px 28px rgba(253,174,84,0.42),
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 0 16px 2px rgba(253,174,84,0.35);
  }
}
.cs-btn {
  width: 140px;
  height: 140px;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(253,174,84,0.18));
  backdrop-filter: saturate(200%) blur(30px);
  -webkit-backdrop-filter: saturate(200%) blur(30px);
  border-radius: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #153036;
  font-size: 15px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  border: 1px solid rgba(253,174,84,0.32);
  box-shadow: 0 6px 22px rgba(253,174,84,0.28),
              inset 0 1px 0 rgba(255,255,255,0.6);
  animation: halo-gameplay 3s ease-in-out infinite;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease;
}
.cs-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 100%);
  border-radius: 28px 28px 0 0;
  pointer-events: none;
}
.cs-btn:hover {
  animation: none;
  transform: scale(1.05);
  box-shadow: 0 10px 28px rgba(253,174,84,0.42),
              inset 0 1px 0 rgba(255,255,255,0.7),
              0 0 22px rgba(253,174,84,0.5);
}
.cs-btn:active { transform: scale(0.95); }
</style>
{% endblock %}

{% block content %}
<a href="{{ url_for('menu') }}"
   class="back-btn-glass"
   aria-label="Retour au menu">←</a>

<div style="display:flex;flex-direction:row;
  align-items:center;justify-content:center;
  gap:24px;padding:0 24px;
  min-height:60vh;">

  <a href="/classement" class="cs-btn">
    <svg width="36" height="36"
      viewBox="0 0 24 24" fill="none"
      stroke="#153036" stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Classement
  </a>

  <a href="/sats" class="cs-btn">
    <svg width="36" height="36"
      viewBox="0 0 24 24" fill="none"
      stroke="#153036" stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
    Stats
  </a>

</div>
{% endblock %}
