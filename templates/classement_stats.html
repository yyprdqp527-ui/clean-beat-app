{% extends "base.html" %}
{% block extra_styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/back-btn-glass.css') }}">{% endblock %}
{% set hide_header = true %}

{% block page_styles %}
<style>
.cs-btn {
  aspect-ratio: 1;
  background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(166,211,220,0.18) 100%);
  border: 2px solid rgba(255,255,255,0.55);
  border-radius: 22px;
  padding: 14px 8px;
  box-shadow: 0 8px 28px rgba(89,113,118,0.14), 0 1.5px 0 rgba(255,255,255,0.7) inset;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(.4,2,.6,1), box-shadow 0.18s;
  text-decoration: none;
}
.cs-btn:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 16px 36px rgba(89,113,118,0.18);
}
.cs-btn:active {
  transform: scale(0.97);
}
.cs-icon {
  font-size: 38px;
  margin-bottom: 6px;
}
.cs-label {
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #3d5a63;
}
</style>
{% endblock %}

{% block content %}
<a href="{{ url_for('menu') }}"
   class="back-btn-glass"
   aria-label="Retour au menu">←</a>

<div style="display:flex;flex-direction:row;
  align-items:center;justify-content:center;
  gap:24px;padding:0 24px;
  min-height:60vh;">

  <a href="/classement" class="cs-btn">
    <svg width="36" height="36"
      viewBox="0 0 24 24" fill="none"
      stroke="#153036" stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Classement
  </a>

  <a href="/sats" class="cs-btn">
    <svg width="36" height="36"
      viewBox="0 0 24 24" fill="none"
      stroke="#153036" stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
    Stats
  </a>

</div>
{% endblock %}
