{% extends "base.html" %}
{% set hide_header = true %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 24px;max-width:360px;margin:0 auto;">

  <a href="/classement"
     style="width:100%;padding:18px 0;
     text-align:center;font-size:17px;
     font-weight:800;color:#153036;
     text-decoration:none;
     background:linear-gradient(135deg,
       rgba(255,255,255,0.92) 0%,
       rgba(253,174,84,0.18) 100%);
     backdrop-filter:saturate(200%) blur(30px);
     -webkit-backdrop-filter:saturate(200%) blur(30px);
     border-radius:20px;
     border:1px solid rgba(253,174,84,0.32);
     box-shadow:0 6px 22px rgba(253,174,84,0.28),
       inset 0 1px 0 rgba(255,255,255,0.6);">
    Classement
  </a>

  <a href="/sats"
     style="width:100%;padding:18px 0;
     text-align:center;font-size:17px;
     font-weight:800;color:#153036;
     text-decoration:none;
     background:linear-gradient(135deg,
       rgba(255,255,255,0.92) 0%,
       rgba(253,174,84,0.18) 100%);
     backdrop-filter:saturate(200%) blur(30px);
     -webkit-backdrop-filter:saturate(200%) blur(30px);
     border-radius:20px;
     border:1px solid rgba(253,174,84,0.32);
     box-shadow:0 6px 22px rgba(253,174,84,0.28),
       inset 0 1px 0 rgba(255,255,255,0.6);">
    Stats
  </a>

</div>
{% endblock %}
